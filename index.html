<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣十六張麻將</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a lively game night with friends — warm, quick, confident.
   IDEA: a Taiwanese mahjong table: green felt top, dark wooden rail, white tiles with sky-blue backs.
   PICTURE: the table itself; on the start screen, a fan of big ivory tiles.
   COLOUR and TYPE: felt green, wood brown, ivory, 紅中 red as the one accent; Noto Serif TC for tile glyphs and titles, Noto Sans TC for UI.
   LAYOUT: full-height table — opponents top/left/right, discards in the middle, your hand and actions along the rail at the bottom. */
:root{color-scheme:light dark;
  --felt:light-dark(#17704f,#0f4b36);--felt-hi:light-dark(#21875f,#155c43);--felt-lo:light-dark(#0f5a3e,#0a3a29);
  --rail:light-dark(#5c3820,#2a190e);--rail-hi:light-dark(#76492a,#3a2414);
  --card:light-dark(#fbf7ec,#221b14);--ink:light-dark(#1d1a14,#efe8d6);--muted:light-dark(#6b6253,#b8ad97);--line:light-dark(#e3dac5,#3b3128);
  --on:#f6f1e2;--on-dim:rgba(246,241,226,.72);--red:#c4262e;--red-lo:#86161c;--jade:#1d7a56;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--serif:'Noto Serif TC','Songti TC','PMingLiU',serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--rail);color:var(--on);font:16px/1.5 var(--sans);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.t:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:900;line-height:1.05;margin:0;text-wrap:balance}

/* ---------- tiles：白牌藍背的立體牌 ---------- */
.t{--w:32px;display:inline-block;position:relative;flex:none;width:var(--w);height:calc(var(--w)*1.34);padding:0;border:0;
  border-radius:calc(var(--w)*.16);background:linear-gradient(165deg,#fff 0%,#f8f9f7 50%,#e7ebe9 100%);
  --in:inset 0 calc(var(--w)*.03) 0 #fff,inset 0 calc(var(--w)*-.05) calc(var(--w)*.08) rgba(90,110,120,.18);
  --edge:0 calc(var(--w)*.075) 0 #dde2e1,0 calc(var(--w)*.085) 0 #c5cdcd,0 calc(var(--w)*.17) 0 #2f9ed6,0 calc(var(--w)*.18) 0 #1f7db3,0 calc(var(--w)*.24) calc(var(--w)*.2) rgba(0,0,0,.35);
  box-shadow:var(--in),var(--edge);margin-bottom:calc(var(--w)*.18)}
.t svg{position:absolute;left:6%;top:4.5%;width:88%;height:89%;overflow:visible}
.lay .t,.river .t,.ml .t{height:calc(var(--w)*1.3);margin-bottom:calc(var(--w)*.1);
  --edge:0 calc(var(--w)*.05) 0 #d3d9d8,0 calc(var(--w)*.1) 0 #2f9ed6,0 calc(var(--w)*.14) calc(var(--w)*.12) rgba(0,0,0,.4)}
.t.back{background:linear-gradient(160deg,#62c4ee 0%,#38a6de 46%,#2389c4 100%);
  --in:inset 0 calc(var(--w)*.03) 0 rgba(255,255,255,.4),inset 0 calc(var(--w)*-.05) calc(var(--w)*.08) rgba(0,40,70,.3);
  --edge:0 calc(var(--w)*.075) 0 #1f7db3,0 calc(var(--w)*.085) 0 #186a99,0 calc(var(--w)*.17) 0 #f3f5f4,0 calc(var(--w)*.18) 0 #c5cdcd,0 calc(var(--w)*.24) calc(var(--w)*.2) rgba(0,0,0,.35)}
.t.dim{filter:brightness(.84) saturate(.8)}
.t.win{box-shadow:0 0 0 calc(var(--w)*.07) #e03a2f,0 0 calc(var(--w)*.4) rgba(224,58,47,.7),var(--edge)}
.t.last{box-shadow:0 0 0 calc(var(--w)*.07) #ffd54a,0 0 calc(var(--w)*.4) rgba(255,213,74,.85),var(--edge)}
.t.fresh{animation:drop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{translate:0 -40%;scale:1.25;opacity:.2}to{translate:none;scale:none;opacity:1}}
.mini{--w:16px}
/* 對手立著的牌：對家看到牌背，上下家看到側邊 */
.st{--w:14px;flex:none;display:inline-block;width:var(--w);height:calc(var(--w)*1.3);margin-top:calc(var(--w)*.16);
  border-radius:calc(var(--w)*.14) calc(var(--w)*.14) calc(var(--w)*.08) calc(var(--w)*.08);background:linear-gradient(180deg,#5cc0ec,#2f9ed6 60%,#1f7db3);
  box-shadow:0 calc(var(--w)*-.16) 0 #f3f5f4,0 calc(var(--w)*-.16) 0 1px rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.3),0 calc(var(--w)*.12) calc(var(--w)*.14) rgba(0,0,0,.35)}
.sd{--w:14px;flex:none;display:block;width:calc(var(--w)*.62);height:calc(var(--w)*.86);border-radius:calc(var(--w)*.1);box-shadow:0 calc(var(--w)*.08) calc(var(--w)*.1) rgba(0,0,0,.35)}
.sd.l{background:linear-gradient(90deg,#f3f5f4 0 38%,#c5cdcd 38% 44%,#2f9ed6 44% 100%)}
.sd.r{background:linear-gradient(90deg,#2f9ed6 0 56%,#c5cdcd 56% 62%,#f3f5f4 62% 100%)}

/* ---------- start / lobby ---------- */
.start,.lobby{min-height:100%;background:radial-gradient(120% 90% at 50% 30%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));
  padding:clamp(20px,4vw,56px) max(4vw,16px) calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:22px}
.fan{display:flex;justify-content:center;padding:18px 0 8px;height:clamp(120px,22vw,190px)}
.fan .t{--w:clamp(48px,10vw,82px);margin:0 calc(var(--w)*-.06);transform-origin:50% 130%}
.start h1{font-size:clamp(34px,6vw,52px);text-align:center}
.lead{max-width:34em;text-align:center;color:var(--on-dim);margin:0;font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.note{color:var(--on-dim);font-size:14px;text-align:center;max-width:36em;margin:0}
.note b{color:var(--on)}
.err{background:rgba(196,38,46,.92);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(900px,100%);margin-top:6px}
.steps div{background:rgba(0,0,0,.16);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--on-dim)}
.steps b{display:block;color:var(--on);font-size:16px;margin-bottom:2px}

.lobby h1{font-size:clamp(28px,4.4vw,40px)}
.ltable{position:relative;width:min(560px,100%);aspect-ratio:1/0.92;border-radius:28px;background:radial-gradient(circle at 50% 45%,var(--felt-hi),var(--felt-lo));
  box-shadow:0 0 0 12px var(--rail-hi),0 0 0 14px rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.35);margin:14px 0 6px}
.ltable .mid{position:absolute;inset:34% 30%;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(18px,3.4vw,26px);color:var(--on-dim)}
.seat{position:absolute;width:clamp(128px,30%,170px);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:6px;align-items:center}
.seat.p0{left:50%;bottom:-6%;transform:translateX(-50%)}.seat.p2{left:50%;top:-6%;transform:translateX(-50%)}
.seat.p1{right:-3%;top:50%;transform:translateY(-50%)}.seat.p3{left:-3%;top:50%;transform:translateY(-50%)}
.seat .lab{font-size:13px;color:var(--muted)}
.seat .nm{font-weight:700;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.seat.empty .nm{color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:12px;line-height:1;padding:4px 7px;border-radius:99px;background:var(--line);color:var(--ink);vertical-align:middle;white-space:nowrap}
.tag.you{background:var(--red);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa;vertical-align:middle;margin-left:4px}
.dot.on{background:#3fdc8c;box-shadow:0 0 0 2px rgba(63,220,140,.25)}
.panel{width:min(560px,100%);background:var(--card);color:var(--ink);border-radius:18px;padding:16px 18px;display:grid;gap:12px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.panel h3{font-size:18px}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opt>span{width:4.6em;color:var(--muted);font-size:15px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-size:15px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip:disabled{cursor:default;opacity:.85}
.panel .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.small{font-size:14px;color:var(--muted);margin:0}

/* ---------- buttons ---------- */
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:0;font-weight:700;font-size:17px;background:#fbf7ec;color:#1d1a14;
  box-shadow:0 3px 0 #b8a983;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8a983}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-lo)}
.btn.ghost{background:transparent;color:var(--on);box-shadow:inset 0 0 0 2px rgba(246,241,226,.45)}
.btn.sm{min-height:38px;font-size:15px;padding:0 12px;border-radius:10px}
.panel .btn.ghost,.card .btn.ghost,.seat .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn .t{--w:20px;margin-bottom:2px}

/* ---------- game ---------- */
.game{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:radial-gradient(ellipse at 50% 0%,#74482a 0%,#4d2d17 62%,#33200f 100%);overflow:hidden}
#r-ban{padding:0 8px 6px;display:grid;gap:6px;grid-row:2}#r-ban:empty{display:none}.game>.hud{grid-row:1}.game>.table{grid-row:3}.game>#r-mine{grid-row:4}
.hud{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;color:var(--on)}
.hud .rd{font-family:var(--serif);font-weight:900;font-size:18px;white-space:nowrap}
.hud .rd small{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--on-dim);margin-left:6px}
.hud .rd small span+span::before{content:' · '}
.hud .sp{flex:1}
.hud .btn{min-height:40px}
/* 牌桌：綠絨桌面、木框，整張桌子微微往後傾 */
.table{position:relative;margin:4px 12px 10px;padding:8px;border-radius:26px;min-height:0;
  background:radial-gradient(ellipse at 50% 45%,#25916a 0%,#18744f 55%,#0e5539 100%);
  box-shadow:0 0 0 6px #845231,0 0 0 9px #2b190b,inset 0 0 0 2px rgba(0,0,0,.25),inset 0 0 60px rgba(0,0,0,.38),0 14px 30px rgba(0,0,0,.45);
  display:grid;gap:6px;grid-template-columns:minmax(0,var(--side)) minmax(0,1fr) minmax(0,var(--side));grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "left center right";--side:clamp(60px,13vw,150px);transform:perspective(1700px) rotateX(9deg);transform-origin:50% 100%}
.opp{display:flex;gap:5px;align-items:center;min-height:0;min-width:0;overflow:hidden}
.opp.p2{grid-area:top;justify-content:center;flex-wrap:wrap;gap:4px 12px}
.opp.p1,.opp.p3{flex-direction:column;justify-content:center}
.opp.p1{grid-area:right}.opp.p3{grid-area:left}
.who{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;background:rgba(0,0,0,.38);font-size:14px;line-height:1.2;max-width:100%;transition:box-shadow .2s}
.opp.p1 .who,.opp.p3 .who{flex-wrap:wrap;justify-content:center;border-radius:12px;padding:4px 6px;gap:2px 5px}
.opp.on .who,.mine.on .who{box-shadow:0 0 0 2px #ffd54a,0 0 16px rgba(255,213,74,.55)}
.who .nm{font-weight:700;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sc{font-variant-numeric:tabular-nums;color:var(--on-dim)}
.wd{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fbf7ec;color:#1d1a14;font:900 14px/1 var(--serif)}
.wd.dealer{background:var(--red);color:#fff}
.ml{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:flex-end}
.ml .g{display:flex;gap:1px}
.opp .ml{justify-content:center}
.opp .ml .t{--w:clamp(11px,1.9vw,22px)}
.opp .backs{display:flex;align-items:flex-end;gap:1px}
.opp.p2 .backs .st{--w:clamp(9px,1.7vw,20px)}
.opp.p1 .backs,.opp.p3 .backs{flex-direction:column;align-items:center;gap:1px}
.opp .backs .sd{--w:clamp(8px,min(2vw,3.1vh),24px)}
.opp .backs .gap{flex:none;width:6px;height:6px}
/* 中間：四家的牌河各自朝向自己，正中央是控制台 */
.center{grid-area:center;display:grid;gap:4px;min-height:0;
  grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);
  grid-template-areas:"rl rt rr" "rl info rr" "rl rb rr"}
.river{display:flex;flex-wrap:wrap;gap:2px 1px;border-radius:10px;padding:3px;min-height:0;min-width:0;overflow:hidden;align-content:flex-start}
.river .t{--w:clamp(13px,2.6vw,30px)}
.river.many .t{--w:clamp(11px,2vw,24px)}
.river.p0{grid-area:rb;flex-wrap:wrap-reverse;justify-content:center}
.river.p2{grid-area:rt;flex-direction:row-reverse;justify-content:center}
.river.p2 .t{transform:rotate(180deg)}
.river.p3{grid-area:rl;flex-direction:column;justify-content:center}
.river.p1{grid-area:rr;flex-direction:column-reverse;flex-wrap:wrap-reverse;justify-content:center}
.river.p3 .t{transform:rotate(90deg);margin:calc(var(--w)*-.15) calc(var(--w)*.17)}
.river.p1 .t{transform:rotate(-90deg);margin:calc(var(--w)*-.15) calc(var(--w)*.17)}
.river.on{background:rgba(255,213,74,.10)}
.info{grid-area:info;display:grid;place-items:center;gap:4px;text-align:center;align-content:center;padding:2px}
.dial{position:relative;width:clamp(70px,min(11vw,19vh),124px);aspect-ratio:1;border-radius:18%;background:linear-gradient(160deg,#3a2a1c,#1a120b);
  box-shadow:inset 0 0 0 2px rgba(255,213,74,.25),inset 0 2px 0 rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.45)}
.dial span{position:absolute;font:900 clamp(13px,min(2.2vw,3.8vh),22px)/1 var(--serif);color:rgba(246,241,226,.6)}
.dial span.on{color:#ffd54a;text-shadow:0 0 10px rgba(255,213,74,.8)}
.dial span.dl{color:var(--on)}
.dial .q0{bottom:7%;left:50%;transform:translateX(-50%)}.dial .q2{top:7%;left:50%;transform:translateX(-50%)}
.dial .q1{right:8%;top:50%;transform:translateY(-50%)}.dial .q3{left:8%;top:50%;transform:translateY(-50%)}
.dial b{position:absolute;inset:24%;display:grid;place-items:center;border-radius:14%;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,213,74,.3);
  font:700 clamp(14px,min(2.4vw,4vh),24px)/1 var(--sans);font-variant-numeric:tabular-nums;color:#ffd54a}
.dial b small{display:block;font-size:10px;font-weight:500;color:var(--on-dim);margin-top:2px}
.lastlog{font-size:13px;color:var(--on);min-height:1.4em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
/* 自己的牌 */
.mine{position:relative;padding:2px 10px calc(8px + env(safe-area-inset-bottom));display:grid;gap:4px}
.mine .top{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.mine .ml .t{--w:clamp(16px,3vw,30px)}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:2px;min-height:calc(var(--tw)*1.62);padding-top:calc(var(--tw)*.3);--tw:clamp(19px,calc((100vw - 34px)/18.2),56px)}
.hand .t{--w:var(--tw);transition:transform .12s}
.hand button.t:hover{transform:translateY(-8%)}
.hand .t.sel{transform:translateY(-24%)!important;box-shadow:0 0 0 calc(var(--w)*.05) #ffd54a,0 0 calc(var(--w)*.4) rgba(255,213,74,.75),var(--in),var(--edge)}
.hand .t.drawn{margin-left:calc(var(--tw)*.45)}
.hand.wait .t{cursor:default}
.hand.busy{opacity:.75}
.bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:50px}
.msg{color:var(--on-dim);font-size:15px;text-align:center}
.msg b{color:var(--on)}
.timer{flex:0 0 100%;display:flex;justify-content:center;margin-top:2px}
.timer s{display:block;width:min(320px,70%);height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:#ffd54a;transition:width .25s linear}
.timer.low i{background:var(--red)}
/* 聽牌提示：要等的牌和還剩幾張 */
.ting{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1.5px rgba(255,213,74,.55);font-size:14px;color:#ffe9a8;font-weight:700}
.ting .tw{display:inline-flex;align-items:center;gap:3px}
.ting .tw .t{--w:20px;margin-bottom:3px}
.ting .tw i{font-style:normal;min-width:22px;height:20px;padding:0 5px;border-radius:99px;display:inline-grid;place-items:center;background:#ffd54a;color:#2a1406;font:700 13px/1 var(--sans)}
.ting .tw i.z{background:rgba(246,241,226,.25);color:var(--on-dim)}
.ting .tw.z .t{opacity:.5}
.ting small{font-size:13px;font-weight:500;color:var(--on-dim)}
.banner{background:rgba(0,0,0,.45);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}

/* ---------- overlays ---------- */
#ov:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(10,14,12,.55);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:18px 20px;width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.45);display:grid;gap:12px}
.card h2{font-size:clamp(26px,5vw,36px)}
.card .sub{color:var(--muted);margin:-6px 0 0}
.wh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end;padding:10px;border-radius:14px;background:var(--felt);}
.wh .t{--w:clamp(18px,4.4vw,34px)}
.tai{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;margin:0;padding:0;list-style:none}
.tai li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.tai li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{font-family:var(--serif);font-weight:900;font-size:20px}
table.pay{width:100%;border-collapse:collapse;font-size:15px}
.pay td,.pay th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.pay th{font-weight:500;color:var(--muted);font-size:13px}
.pay .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:#1d7a56}.neg{color:var(--red)}
:root[data-theme=dark] .pos{color:#5fd39c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pos{color:#5fd39c}}
.card .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.card details summary{cursor:pointer;color:var(--muted);font-size:14px}
.reveal{display:grid;gap:6px;margin-top:8px}
.reveal div{display:flex;gap:2px;flex-wrap:wrap;align-items:center;font-size:13px}
.reveal .t{--w:16px}
.rules h3{font-size:17px;margin-top:4px}
.rules ul{margin:0;padding-left:1.2em;font-size:15px}

<script>window.mjBackend = new Promise(function (r) { window.__mjResolve = r; });</script>
<script type="module">
/* Firebase 轉接層：把遊戲需要的「資料庫 / 身分 / 在線偵測」接到 Firebase 匿名登入 + Realtime Database。
   文件一律以 JSON 字串存放（{ j: "..." }），避免 Realtime Database 把空陣列、null 和數字鍵改掉。 */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
import { getDatabase, ref, set, get, remove, onValue, runTransaction, onDisconnect, serverTimestamp, push } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';

const CONFIG = {
  apiKey: 'AIzaSyBoJTcGF9349-TW6-ASLXxRhcHZlUrPDAU',
  authDomain: 'tw-mahjong-1125.firebaseapp.com',
  databaseURL: 'https://tw-mahjong-1125-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'tw-mahjong-1125',
  storageBucket: 'tw-mahjong-1125.firebasestorage.app',
  messagingSenderId: '569497714487',
  appId: '1:569497714487:web:8797684c7f516e2c08a4b2',
};

const finish = () => { if (window.__mjResolve) window.__mjResolve(); };
function fail(e) {
  const c = String((e && (e.code || e.message)) || e);
  window.mjBackendError =
    /operation-not-allowed|admin-restricted/.test(c) ? '線上服務還沒開啟匿名登入：請到 Firebase 主控台 → Authentication → 登入方式，啟用「匿名」。'
    : /unauthorized-domain/.test(c) ? '這個網址還沒加入 Firebase 的授權網域：請到 Authentication → 設定 → 授權網域，加入這個網站的網域。'
    : /network/.test(c) ? '連不上線上服務，請確認網路後重新整理。'
    : '線上服務啟動失敗（' + c + '），請重新整理再試。';
  finish();
}

try {
  const app = initializeApp(CONFIG);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const uid = await new Promise((resolve, reject) => {
    let first = true;
    const stop = onAuthStateChanged(auth, u => {
      if (u) { stop(); resolve(u.uid); return; }
      if (first) { first = false; signInAnonymously(auth).catch(reject); }
    }, reject);
  });

  /* ---- 連線狀態、伺服器時間 ---- */
  let connected = false, offset = 0;
  onValue(ref(db, '.info/serverTimeOffset'), s => { offset = Number(s.val()) || 0; });

  /* ---- 在線偵測：伺服器在斷線時自動刪掉自己的 presence ---- */
  let peers = [];
  const peerFns = new Set();
  const emitPeers = () => { for (const f of peerFns) f({ peers, joined: [], left: [], updated: [] }); };
  onValue(ref(db, '.info/connected'), s => {
    connected = s.val() === true;
    if (connected) {
      const me = push(ref(db, 'presence/' + uid));
      onDisconnect(me).remove().then(() => set(me, serverTimestamp())).catch(() => {});
    }
    window.dispatchEvent(new Event('mj-conn'));
  });
  onValue(ref(db, 'presence'), s => {
    const v = s.val() || {};
    peers = Object.keys(v).map(by => ({ by, peer: by, isMe: by === uid, presence: {}, kind: 'viewer', guest: false }));
    emitPeers();
  }, () => {});

  /* ---- 暱稱 ---- */
  let names = {}, myName = '';
  try { myName = localStorage.getItem('mj-nick') || ''; } catch (e) { /* storage blocked */ }
  onValue(ref(db, 'names'), s => { names = s.val() || {}; window.dispatchEvent(new Event('mj-names')); }, () => {});
  if (myName) set(ref(db, 'names/' + uid), myName).catch(() => {});
  const user = {
    id: async () => uid,
    can: async () => true, isOwner: async () => false, canEdit: async () => false,
    me: async () => ({ id: uid, name: names[uid] || myName }),
    profiles: async ids => Object.fromEntries([...new Set([].concat(ids))].map(id => [id, { id, name: typeof names[id] === 'string' ? names[id] : '', isMe: id === uid }])),
    getName: () => (typeof names[uid] === 'string' && names[uid]) || myName,
    async setName(n) {
      n = String(n).replace(/\s+/g, ' ').trim().slice(0, 12);
      if (!n) return;
      myName = n; names = { ...names, [uid]: n };
      try { localStorage.setItem('mj-nick', n); } catch (e) { /* in-memory only */ }
      await set(ref(db, 'names/' + uid), n);
    },
  };

  /* ---- 文件式資料庫介面 ---- */
  const mapErr = e => ({ code: /permission/i.test(String((e && (e.code || e.message)) || e)) ? 'invalid_argument' : 'unavailable', message: String((e && e.message) || e) });
  const dec = v => (v && typeof v.j === 'string') ? JSON.parse(v.j) : null;
  const snapOf = (path, v) => { const d = dec(v); return { id: path.split('/').pop(), exists: d != null, data: () => (d == null ? undefined : d), metadata: { fromCache: false, hasPendingWrites: false } }; };
  const wrap = async p => { try { return await p; } catch (e) { throw mapErr(e); } };
  function docRef(path) {
    const r = ref(db, path);
    return {
      id: path.split('/').pop(), path,
      get: async () => snapOf(path, (await wrap(get(r))).val()),
      set: d => wrap(set(r, { j: JSON.stringify(d) })),
      update: async d => { const cur = dec((await wrap(get(r))).val()); if (!cur) throw { code: 'invalid_argument', message: 'missing' }; await wrap(set(r, { j: JSON.stringify({ ...cur, ...d }) })); },
      delete: () => wrap(remove(r)),
      async acquire({ holder, ttlMs }) {
        const now = Date.now() + offset, ttl = Math.min(600000, Math.max(1000, ttlMs || 30000));
        const res = await wrap(runTransaction(r, cur => (!cur || typeof cur !== 'object' || !(cur.exp > now) || cur.holder === holder) ? { holder, exp: now + ttl } : undefined));
        return { acquired: !!res.committed };
      },
      onSnapshot(next, err) { return onValue(r, s => next(snapOf(path, s.val())), e => err && err(mapErr(e))); },
      collection: sub => coll(path + '/' + sub),
    };
  }
  function coll(path) {
    const r = ref(db, path);
    const list = v => Object.keys(v || {}).map(id => snapOf(path + '/' + id, v[id])).filter(d => d.exists);
    return {
      path, doc: id => docRef(path + '/' + id),
      async get() { const docs = list((await wrap(get(r))).val()); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false } }; },
      onSnapshot(next, err) {
        let prev = {};
        return onValue(r, s => {
          const v = s.val() || {}, cur = {}, changes = [];
          for (const id of Object.keys(v)) cur[id] = JSON.stringify(v[id]);
          for (const id in cur) if (prev[id] !== cur[id]) { const d = snapOf(path + '/' + id, v[id]); if (d.exists) changes.push({ type: prev[id] ? 'modified' : 'added', doc: d }); }
          for (const id in prev) if (!(id in cur)) changes.push({ type: 'removed', doc: snapOf(path + '/' + id, JSON.parse(prev[id])) });
          prev = cur;
          if (changes.length) next({ docs: list(v), size: Object.keys(v).length, empty: !Object.keys(v).length, docChanges: () => changes, metadata: { fromCache: false } });
        }, e => err && err(mapErr(e)));
      },
    };
  }
  const DB = { doc: docRef, collection: coll };

  /* ---- 即時通道：Firebase 本身就會即時推送，這裡只提供在線名單 ---- */
  const room = {
    presence: async () => {},
    onPeers(fn) { peerFns.add(fn); setTimeout(() => fn({ peers, joined: [], left: [], updated: [] }), 0); return () => peerFns.delete(fn); },
    on: () => () => {},
    emit: async () => {},
    connected: () => connected,
  };

  window.claude = {
    features: { site: true, push: true, presence: true, nickname: true },
    use: async n => (n === 'db' ? DB : n === 'user' ? user : n === 'room' ? room : null),
  };
  finish();
} catch (e) { fail(e); }

</script>
<script>
/* 台灣十六張麻將 規則引擎 — 純邏輯，無 DOM。牌以 0..41 表示：
   0-8 萬、9-17 筒、18-26 條、27-30 東南西北、31-33 中發白、34-41 春夏秋冬梅蘭竹菊 */
(function (root) {
'use strict';
const RESERVE = 16;
const NUM = '一二三四五六七八九';
const HONN = ['東風', '南風', '西風', '北風', '紅中', '青發', '白板'];
const FLW = '春夏秋冬梅蘭竹菊';
const WIND = '東南西北';
const E = { rng: Math.random };

/* ---------- 牌局流程 ---------- */

/* ---------- 玩家動作 ---------- */

    <li>144 張牌（含 8 張花）。每人 16 張，莊家先摸第 17 張；花牌亮出並從牌尾補牌。</li>
    <li>胡牌需要 5 組（順子或刻子）加 1 對眼。可以吃（只限上家）、碰、槓。</li>
    <li>優先順序：胡 ＞ 碰、槓 ＞ 吃。兩人同時胡，由放槍者的下家優先（截胡）。可搶槓胡。</li>
    <li>牌牆剩 16 張時流局，莊家連莊；莊家胡牌也連莊，否則換下家坐莊。</li>
    <li>出牌限時 25 秒、吃碰限時 10 秒；連續逾時兩次會自動托管，點「取消托管」即可回來。</li></ul>
    <h3>計分</h3><ul><li>放槍：放槍者付「底＋台數×每台」。自摸：三家各付一份。</li><li>莊家胡或莊家付款時，另加莊家 1 台與連莊台。</li></ul>
    <h3>台數表</h3><table>${TAI.map(([n, t]) => `<tr><td>${n}</td><td class="n">${t} 台</td></tr>`).join('')}</table>
    <p class="small">各地台數規定略有不同，這裡採常見的台灣十六張算法。</p>
    <div class="foot"><button class="btn" data-a="close">知道了</button></div></div>`;
}
function updateTimers() {
  const left = App.dlAt - Date.now(), f = Math.max(0, Math.min(1, left / App.dlMax));
  for (const el of document.querySelectorAll('.timer')) { el.querySelector('i').style.width = (f * 100).toFixed(1) + '%'; el.classList.toggle('low', left < 4000); }
  for (const el of document.querySelectorAll('[data-secs]')) el.textContent = Math.max(0, Math.ceil(left / 1000));
}
function toast(msg) {
  let el = document.querySelector('.toast.tmp');
  if (!el) { el = document.createElement('div'); el.className = 'toast tmp'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(App.toastT); App.toastT = setTimeout(() => el.remove(), 3200);
}

/* ================= 操作 ================= */
function currentTiles() { const V = App.V; return V && V.priv ? handTiles(V.priv).tiles : []; }
function onClick(e) {
  const b = e.target.closest('[data-a]');
  if (!b) { if (e.target.classList && e.target.classList.contains('ov') && (App.ov === 'rules' || App.ov === 'menu')) { App.ov = null; render(); } return; }
  if (b.disabled) return;
  const a = b.dataset.a, d = b.dataset, V = App.V;
  switch (a) {
    case 'create': if (needNick()) { App.ov = 'nick'; render(); break; } createTable(); break;
    case 'nick': App.ov = 'nick'; render(); setTimeout(() => { const el = document.getElementById('nick-in'); if (el) el.focus(); }, 50); break;
    case 'nick-save': saveNick(); break;
    case 'local': startLocal(); break;
    case 'sit': if (needNick()) { App.ov = 'nick'; render(); break; } send({ t: 'sit', s: +d.s }); break;
    case 'stand': send({ t: 'stand' }); break;
    case 'bot': if (Host.on && !Host.lobby.seats[+d.s]) { Host.lobby.seats[+d.s] = { bot: true }; Host.commit(); } break;
    case 'unseat': if (Host.on && !Host.G) { Host.lobby.seats[+d.s] = null; Host.commit(); } break;
    case 'cfg': if (Host.on && !Host.G) { const c = { ...Host.lobby.cfg }; if (d.b) { c.base = +d.b; c.per = +d.p; } if (d.r) c.rounds = +d.r; Host.lobby.cfg = c; Host.commit(); } break;
    case 'start': if (Host.on) startMatch(); break;
    case 'tile': {
      if (myPending(App.V)) return;
      const i = +d.i;
      if (App.sel === i) { const k = currentTiles()[i]; if (k != null) send({ t: 'discard', k }); }
      else { App.sel = i; render(); }
      break;
    }
    case 'discard': { const k = currentTiles()[App.sel]; if (k != null) send({ t: 'discard', k }); break; }
    case 'tsumo': send({ t: 'tsumo' }); break;
    case 'akong': send({ t: 'akong', k: +d.k }); break;
    case 'jkong': send({ t: 'jkong', k: +d.k }); break;
    case 'claim': {
      const o = V && V.priv && V.priv.opts;
      if (d.t === 'chi') { const q = o && o.claim && o.claim.chi && o.claim.chi[+d.q]; if (q) send({ t: 'chi', seq: q }); }
      else send({ t: d.t });
      break;
    }
    case 'auto': App.ov = null; send({ t: 'auto', on: d.on === '1' }); break;
    case 'ready': send({ t: 'ready' }); break;
    case 'menu': App.ov = 'menu'; render(); break;
    case 'rules': App.ov = 'rules'; render(); break;
    case 'close': App.ov = null; render(); break;
    case 'hideres': App.hideRes = V.game.handNo; render(); break;
    case 'showres': App.hideRes = -1; render(); break;
    case 'skipfx': if (App.flow) App.flow.skip = true; render(); break;
    case 'takeover': App.ov = { ask: '接手主持後，由你的瀏覽器負責發牌與計分。這一局會重新發牌，分數與圈數保留。請在房主確定離線時才使用。', yes: 'takeover!' }; render(); break;
    case 'takeover!': takeover(false); break;
    case 'dissolve': App.ov = { ask: '解散牌桌後，所有人的座位與分數都會清除。', yes: 'dissolve!' }; render(); break;
    case 'dissolve!': dissolve(); break;
    case 'tolobby': App.ov = { ask: '結束目前牌局並回到大廳？本將分數會清除。', yes: 'tolobby!' }; render(); break;
    case 'tolobby!': toLobby(); break;
    case 'again': again(); break;
    case 'quitlocal': quitLocal(); break;
  }
}
document.addEventListener('click', onClick);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'nick-in') { saveNick(); return; }
  if (e.key === 'Escape' && App.ov && !(App.ov === 'nick' && needNick())) { App.ov = null; render(); }
});
setInterval(updateTimers, 250);
setInterval(() => {
  const V = App.V;
  if (App.net && !App.local && App.S && App.S.hostId === App.uid && !Host.on && !App.restoring) tryRestore(App.S);
  if (V && (V.screen === 'lobby' || App.feat.presence) && !V.isHost && App.online && V.hostId && !App.online.has(V.hostId)) renderSoon();
}, 3000);
setInterval(() => {
  if (!App.net || App.local || Host.on || !App.loaded) return;
  const g = App.S && App.S.game, now = Date.now();
  const gap = App.feat.push ? 15000 : g && (g.phase === 'play' || g.phase === 'end') ? 1800 : 3000;
  if (now - App.lastStateAt > gap && now - App.lastPollAt > gap) fetchState();
  if (App.pending && now - App.pending.at >= 8000) { App.pending = null; App.unconfirmedAt = now; fetchState(); renderSoon(); }
  const st = hostStale(App.V);
  if (st !== App.staleShown) { App.staleShown = st; renderSoon(); }
}, 1000);

/* ================= 啟動 ================= */
const use = n => (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
async function boot() {
  render();
  if (window.mjBackend) await Promise.race([window.mjBackend, sleep(15000)]);
  App.feat = (window.claude && window.claude.features) || {};
  const [db, user, room] = await Promise.all([use('db'), use('user'), use('room')]);
  App.db = db; App.user = user; App.room = room;
  App.uid = user ? await user.id() : null;
  App.booted = true;
  if (!db || !App.uid) { App.net = false; if (window.mjBackend && !window.mjBackendError) window.mjBackendError = '連不上線上服務，請確認網路後重新整理。'; if (!App.local) App.V = { screen: 'start' }; render(); return; }
  if (needNick()) App.ov = 'nick';
  window.addEventListener('mj-names', () => { if (App.V) refreshNames(App.V); });
  window.addEventListener('mj-conn', () => renderSoon());
  App.net = true;
  try { App.canWrite = await user.can('data.write'); } catch (e) { App.canWrite = null; }
  await Keys.init();
  try {
    const d = await myRef().get();
    const x = d.exists ? d.data() : null;
    App.myActs = x && Array.isArray(x.acts) ? x.acts.filter(q => q && typeof q.n === 'number').slice(-6) : [];
    App.myN = App.myActs.reduce((m, q) => Math.max(m, q.n), 0);
    if (!x || JSON.stringify(x.pub) !== JSON.stringify(Keys.pub)) writePlayer();
  } catch (e) { writePlayer(); }
  const t = setTimeout(() => { if (!App.loaded) { App.err = '暫時連不上牌桌資料，請確認網路後重新整理。'; render(); } }, 10000);
  db.collection('mjp').onSnapshot(onPlayersSnap, () => {});
  stateRef().onSnapshot(s => { clearTimeout(t); if (App.err.startsWith('暫時')) App.err = ''; onStateSnap(s); },
    () => { clearTimeout(t); App.err = '牌桌資料連線中斷，請重新整理頁面。'; render(); });
  if (room) {
    room.presence({ uid: App.uid }).catch(() => {});
    room.onPeers(ch => {
      App.online = new Set(ch.peers.map(p => p.by || (p.presence && typeof p.presence.uid === 'string' ? p.presence.uid : null)).filter(Boolean));
      if (App.uid) App.online.add(App.uid);
      for (const u of App.online) App.seenEver.add(u);
      renderSoon();
    }, () => { App.online = null; renderSoon(); });
    room.on('ping', msg => {
      if (Host.on || App.local) return;
      const S = App.S, d = (msg && msg.data) || {};
      if (S && msg.by && S.hostId && msg.by !== S.hostId) return;
      if (S && d.tid && d.tid === S.tid && (d.v || 0) <= (S.v || 0)) return;
      App.lastPing = Date.now(); fetchState();
    }, () => {});
    room.on('act', msg => {
      if (!Host.on || App.local || !msg || !msg.by || !msg.data || !Array.isArray(msg.data.acts)) return;
      const pk = msg.data.pub;
      if (pk && typeof pk === 'object' && !pubOf(msg.by)) { App.roomPubs[msg.by] = pk; Host.publish(); }
      ingest(msg.by, msg.data.acts);
    }, () => {});
  }
  render();
}
window.__mj = { App, Host, renderSoon, fireFx }; // 測試用：讓自動化測試能調整單機節奏
boot();
}
