<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣十六張麻將</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#17704f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="十六張麻將">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a lively game night with friends — warm, quick, confident.
   IDEA: a Taiwanese mahjong table: green felt top, dark wooden rail, white tiles with sky-blue backs.
   PICTURE: the table itself; on the start screen, a fan of big ivory tiles.
   COLOUR and TYPE: felt green, wood brown, ivory, 紅中 red as the one accent; Noto Serif TC for tile glyphs and titles, Noto Sans TC for UI.
   LAYOUT: full-height table — opponents top/left/right, discards in the middle, your hand and actions along the rail at the bottom. */
:root{color-scheme:light dark;
  --felt:light-dark(#17704f,#0f4b36);--felt-hi:light-dark(#21875f,#155c43);--felt-lo:light-dark(#0f5a3e,#0a3a29);
  --rail:light-dark(#5c3820,#2a190e);--rail-hi:light-dark(#76492a,#3a2414);
  --card:light-dark(#fbf7ec,#221b14);--ink:light-dark(#1d1a14,#efe8d6);--muted:light-dark(#6b6253,#b8ad97);--line:light-dark(#e3dac5,#3b3128);
  --on:#f6f1e2;--on-dim:rgba(246,241,226,.72);--red:#c4262e;--red-lo:#86161c;--jade:#1d7a56;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;--serif:'Noto Serif TC','Songti TC','PMingLiU',serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--rail);color:var(--on);font:16px/1.5 var(--sans);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.t:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:900;line-height:1.05;margin:0;text-wrap:balance}

/* ---------- tiles：白牌藍背的立體牌 ---------- */
.t{--w:32px;display:inline-block;position:relative;flex:none;width:var(--w);height:calc(var(--w)*1.34);padding:0;border:0;
  border-radius:calc(var(--w)*.16);background:linear-gradient(165deg,#fff 0%,#f8f9f7 50%,#e7ebe9 100%);
  --in:inset 0 calc(var(--w)*.03) 0 #fff,inset 0 calc(var(--w)*-.05) calc(var(--w)*.08) rgba(90,110,120,.18);
  --edge:0 calc(var(--w)*.075) 0 #dde2e1,0 calc(var(--w)*.085) 0 #c5cdcd,0 calc(var(--w)*.17) 0 #2f9ed6,0 calc(var(--w)*.18) 0 #1f7db3,0 calc(var(--w)*.24) calc(var(--w)*.2) rgba(0,0,0,.35);
  box-shadow:var(--in),var(--edge);margin-bottom:calc(var(--w)*.18)}
.t svg{position:absolute;left:6%;top:4.5%;width:88%;height:89%;overflow:visible}
.lay .t,.river .t,.ml .t{height:calc(var(--w)*1.3);margin-bottom:calc(var(--w)*.1);
  --edge:0 calc(var(--w)*.05) 0 #d3d9d8,0 calc(var(--w)*.1) 0 #2f9ed6,0 calc(var(--w)*.14) calc(var(--w)*.12) rgba(0,0,0,.4)}
.t.back{background:linear-gradient(160deg,#62c4ee 0%,#38a6de 46%,#2389c4 100%);
  --in:inset 0 calc(var(--w)*.03) 0 rgba(255,255,255,.4),inset 0 calc(var(--w)*-.05) calc(var(--w)*.08) rgba(0,40,70,.3);
  --edge:0 calc(var(--w)*.075) 0 #1f7db3,0 calc(var(--w)*.085) 0 #186a99,0 calc(var(--w)*.17) 0 #f3f5f4,0 calc(var(--w)*.18) 0 #c5cdcd,0 calc(var(--w)*.24) calc(var(--w)*.2) rgba(0,0,0,.35)}
.t.dim{filter:brightness(.84) saturate(.8)}
.t.win{box-shadow:0 0 0 calc(var(--w)*.07) #e03a2f,0 0 calc(var(--w)*.4) rgba(224,58,47,.7),var(--edge)}
.t.last{box-shadow:0 0 0 calc(var(--w)*.07) #ffd54a,0 0 calc(var(--w)*.4) rgba(255,213,74,.85),var(--edge)}
.t.fresh{animation:drop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{translate:0 -40%;scale:1.25;opacity:.2}to{translate:none;scale:none;opacity:1}}
.mini{--w:16px}
/* 對手立著的牌：對家看到牌背，上下家看到側邊 */
.st{--w:14px;flex:none;display:inline-block;width:var(--w);height:calc(var(--w)*1.3);margin-top:calc(var(--w)*.16);
  border-radius:calc(var(--w)*.14) calc(var(--w)*.14) calc(var(--w)*.08) calc(var(--w)*.08);background:linear-gradient(180deg,#5cc0ec,#2f9ed6 60%,#1f7db3);
  box-shadow:0 calc(var(--w)*-.16) 0 #f3f5f4,0 calc(var(--w)*-.16) 0 1px rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.3),0 calc(var(--w)*.12) calc(var(--w)*.14) rgba(0,0,0,.35)}
.sd{--w:14px;flex:none;display:block;width:calc(var(--w)*.62);height:calc(var(--w)*.86);border-radius:calc(var(--w)*.1);box-shadow:0 calc(var(--w)*.08) calc(var(--w)*.1) rgba(0,0,0,.35)}
.sd.l{background:linear-gradient(90deg,#f3f5f4 0 38%,#c5cdcd 38% 44%,#2f9ed6 44% 100%)}
.sd.r{background:linear-gradient(90deg,#2f9ed6 0 56%,#c5cdcd 56% 62%,#f3f5f4 62% 100%)}

/* ---------- start / lobby ---------- */
.start,.lobby{min-height:100%;background:radial-gradient(120% 90% at 50% 30%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));
  padding:clamp(20px,4vw,56px) max(4vw,16px) calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:22px}
.fan{display:flex;justify-content:center;padding:18px 0 8px;height:clamp(120px,22vw,190px)}
.fan .t{--w:clamp(48px,10vw,82px);margin:0 calc(var(--w)*-.06);transform-origin:50% 130%}
.start h1{font-size:clamp(34px,6vw,52px);text-align:center}
.lead{max-width:34em;text-align:center;color:var(--on-dim);margin:0;font-size:17px}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.note{color:var(--on-dim);font-size:14px;text-align:center;max-width:36em;margin:0}
.note b{color:var(--on)}
.err{background:rgba(196,38,46,.92);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(900px,100%);margin-top:6px}
.steps div{background:rgba(0,0,0,.16);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--on-dim)}
.steps b{display:block;color:var(--on);font-size:16px;margin-bottom:2px}

.lobby h1{font-size:clamp(28px,4.4vw,40px)}
.ltable{position:relative;width:min(560px,100%);aspect-ratio:1/0.92;border-radius:28px;background:radial-gradient(circle at 50% 45%,var(--felt-hi),var(--felt-lo));
  box-shadow:0 0 0 12px var(--rail-hi),0 0 0 14px rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.35);margin:14px 0 6px}
.ltable .mid{position:absolute;inset:34% 30%;display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(18px,3.4vw,26px);color:var(--on-dim)}
.seat{position:absolute;width:clamp(128px,30%,170px);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:6px;align-items:center}
.seat.p0{left:50%;bottom:-6%;transform:translateX(-50%)}.seat.p2{left:50%;top:-6%;transform:translateX(-50%)}
.seat.p1{right:-3%;top:50%;transform:translateY(-50%)}.seat.p3{left:-3%;top:50%;transform:translateY(-50%)}
.seat .lab{font-size:13px;color:var(--muted)}
.seat .nm{font-weight:700;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.seat.empty .nm{color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:12px;line-height:1;padding:4px 7px;border-radius:99px;background:var(--line);color:var(--ink);vertical-align:middle;white-space:nowrap}
.tag.you{background:var(--red);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9aa;vertical-align:middle;margin-left:4px}
.dot.on{background:#3fdc8c;box-shadow:0 0 0 2px rgba(63,220,140,.25)}
.panel{width:min(560px,100%);background:var(--card);color:var(--ink);border-radius:18px;padding:16px 18px;display:grid;gap:12px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.panel h3{font-size:18px}
.opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opt>span{width:4.6em;color:var(--muted);font-size:15px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;font-size:15px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip:disabled{cursor:default;opacity:.85}
.panel .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.small{font-size:14px;color:var(--muted);margin:0}

/* ---------- 大廳：俯視牌桌、座位準備燈、深色設定 ---------- */
.lobby2{min-height:100%;min-height:100dvh;background:radial-gradient(120% 90% at 50% 30%,var(--felt-hi),var(--felt) 55%,var(--felt-lo));
  padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;
  grid-template-columns:minmax(0,500px);justify-content:center;align-content:start;grid-template-areas:"top" "room" "msg" "tb" "set" "foot"}
.ltop{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ltop h1{font-size:clamp(21px,5.6vw,28px)}
.lic{display:flex;gap:6px}.lic .ib{width:42px;height:42px}
.lroom{grid-area:room;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:99px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1.5px rgba(255,213,74,.5)}
.lroom span{font-size:13px;color:var(--on-dim)}
.lroom b{font:900 24px/1 var(--serif);color:#ffd54a;letter-spacing:.06em}
.cpb{border:0;background:none;font-size:12px;padding:4px 9px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(246,241,226,.4);color:var(--on)}
.btn.gold{margin-left:auto;background:#ffd54a;color:#2a1406;box-shadow:0 3px 0 #c79a1e;border-radius:99px}
.lroom0{grid-area:room;justify-self:center}
.lmsg{grid-area:msg;display:grid;gap:8px}.lmsg:empty{display:none}
.ltb{grid-area:tb;position:relative;width:min(100%,420px);aspect-ratio:1;justify-self:center}
.lfelt{position:absolute;inset:12%;border-radius:30px;background:radial-gradient(110% 90% at 50% 35%,#1f8a5f,#136247 70%);
  box-shadow:0 0 0 12px #6b4123,0 0 0 14px #3a2210,inset 0 4px 16px rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.4)}
.ldial{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(76px,22%,92px);aspect-ratio:1;border-radius:18px;background:linear-gradient(#3a2414,#1f130a);
  display:grid;place-items:center;align-content:center;gap:2px;box-shadow:inset 0 0 0 1.5px rgba(255,213,74,.35),0 4px 10px rgba(0,0,0,.4);text-align:center}
.ldial small{font-size:11px;color:var(--on-dim);line-height:1.2}.ldial b{font:900 24px/1 var(--serif);color:#ffd54a}
.lseat{position:absolute;width:clamp(92px,27%,116px);display:grid;justify-items:center;gap:3px;padding:8px 6px 7px;border-radius:16px;background:rgba(20,12,6,.84);
  box-shadow:inset 0 0 0 1.5px rgba(255,213,74,.3),0 6px 14px rgba(0,0,0,.4);text-align:center}
.lseat.q0{left:50%;bottom:0;transform:translateX(-50%)}.lseat.q2{left:50%;top:0;transform:translateX(-50%)}
.lseat.q3{left:0;top:50%;transform:translateY(-50%)}.lseat.q1{right:0;top:50%;transform:translateY(-50%)}
.lseat.me{box-shadow:inset 0 0 0 2px #ffd54a,0 0 16px rgba(255,213,74,.5)}
.lav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:900 20px/1 var(--serif);background:#fbf7ec;color:#1d1a14;box-shadow:0 0 0 2px rgba(255,255,255,.45)}
.lseat.bot .lav{background:#cfd6db;color:#3b4650}
.lseat.empty .lav{background:transparent;color:rgba(246,241,226,.6);box-shadow:none;border:2px dashed rgba(246,241,226,.5)}
.lseat.me .lav{box-shadow:0 0 0 2px #ffd54a}
.ln{font-size:14px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lseat.empty .ln{color:var(--on-dim);font-weight:500}
.lst{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.lst.ok{color:#7fe0a6;background:rgba(127,224,166,.13)}.lst.wt{color:#ffc46b;background:rgba(255,196,107,.13)}.lst.bt{color:#cfd6db;background:rgba(255,255,255,.1)}.lst.hs{color:#ffd54a;background:rgba(255,213,74,.13)}
.sbs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.sb{border:0;background:none;font-size:11.5px;font-weight:700;padding:4px 6px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(246,241,226,.45);color:var(--on);white-space:nowrap;min-height:28px}
.sb:hover{background:rgba(255,255,255,.08)}
.lx{position:absolute;top:-8px;right:-8px;width:28px;height:28px;padding:0;border-radius:50%;border:0;background:#3a2414;color:var(--on);font-size:18px;line-height:1;display:grid;place-items:center;box-shadow:0 0 0 1.5px rgba(255,213,74,.45)}
.lset{grid-area:set;border-radius:16px;padding:12px 14px;display:grid;gap:9px;background:linear-gradient(180deg,#3a2414,#24160b);box-shadow:inset 0 0 0 1px rgba(255,213,74,.35),0 10px 24px rgba(0,0,0,.4)}
.lsh{display:flex;align-items:baseline;gap:8px}.lsh b{font:900 18px var(--serif)}.lsh small{font-size:12px;color:var(--on-dim)}
.lo{display:flex;align-items:center;gap:6px}
.lb{width:4.4em;flex:none;font-size:13px;color:var(--on-dim);white-space:nowrap}
.c2{flex:1;min-height:36px;padding:0 2px;border-radius:99px;border:0;background:transparent;font:500 14px var(--sans);color:var(--on);box-shadow:inset 0 0 0 1.5px rgba(246,241,226,.28);white-space:nowrap}
.c2[aria-pressed=true]{background:#ffd54a;color:#2a1406;font-weight:700;box-shadow:0 2px 0 #c79a1e}
.c2:disabled{cursor:default}.c2:disabled:not([aria-pressed=true]){opacity:.6}
.lsm{margin:0;font-size:12px;color:var(--on-dim)}
.lft{grid-area:foot;display:grid;gap:6px}
.lsub{margin:0;font-size:13px;color:var(--on-dim);text-align:center}
.lbt{display:flex;gap:8px;align-items:center}.lbt .go{flex:1}
.go.hot{animation:gopulse 1.4s ease-in-out infinite}
@keyframes gopulse{0%,100%{box-shadow:0 3px 0 var(--red-lo),0 0 0 0 rgba(255,213,74,0)}50%{box-shadow:0 3px 0 var(--red-lo),0 0 0 6px rgba(255,213,74,.5)}}
.lwait{flex:1;text-align:center;color:var(--on-dim);font-size:14px}
.cbet{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px),(orientation:landscape) and (max-height:520px){
  .lobby2{grid-template-columns:auto minmax(0,460px);grid-template-areas:"tb top" "tb room" "tb msg" "tb set" "tb foot";column-gap:22px;align-items:start;align-content:center}
  .ltb{width:min(440px,calc(100dvh - 40px));align-self:center}
}
@media (orientation:landscape) and (max-height:520px){
  .lobby2{padding:8px 14px calc(8px + env(safe-area-inset-bottom));gap:8px;min-height:100dvh;align-content:center}
  .ltb{width:min(400px,calc(100dvh - 20px),46vw)}
  .ltop h1{font-size:19px}.lic .ib{width:38px;height:38px}
  .lroom{padding:4px 4px 4px 12px}.lroom b{font-size:20px}.lroom .btn{min-height:34px}
  .lset{padding:9px 12px;gap:6px}.c2{min-height:32px;font-size:13px}.lsm{display:none}
  .lsub{font-size:12px}.lbt .btn{min-height:40px}
}

/* ---------- buttons ---------- */
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:0;font-weight:700;font-size:17px;background:#fbf7ec;color:#1d1a14;
  box-shadow:0 3px 0 #b8a983;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8a983}
.btn.red{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-lo)}
.btn.ghost{background:transparent;color:var(--on);box-shadow:inset 0 0 0 2px rgba(246,241,226,.45)}
.btn.sm{min-height:38px;font-size:15px;padding:0 12px;border-radius:10px}
.panel .btn.ghost,.card .btn.ghost,.seat .btn.ghost{color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn .t{--w:20px;margin-bottom:2px}

/* ---------- game ---------- */
.game{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:radial-gradient(ellipse at 50% 0%,#74482a 0%,#4d2d17 62%,#33200f 100%);overflow:hidden}
#r-ban{padding:0 8px 6px;display:grid;gap:6px;grid-row:2}#r-ban:empty{display:none}.game>.hud{grid-row:1}.game>.table{grid-row:3}.game>#r-mine{grid-row:4}
.hud{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;color:var(--on)}
.hud .rd{font-family:var(--serif);font-weight:900;font-size:18px;white-space:nowrap}
.hud .rd small{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--on-dim);margin-left:6px}
.hud .rd small span+span::before{content:' · '}
.hud .sp{flex:1}
.hud .btn{min-height:40px}
.ib{width:44px;height:44px;flex:none;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1.5px rgba(246,241,226,.35)}
.ib:hover{background:rgba(0,0,0,.4)}
.hud .ib+.ib{margin-left:-2px}
/* 牌桌：綠絨桌面、木框，整張桌子微微往後傾 */
.table{position:relative;margin:4px 12px 10px;padding:8px;border-radius:26px;min-height:0;
  background:radial-gradient(ellipse at 50% 45%,#25916a 0%,#18744f 55%,#0e5539 100%);
  box-shadow:0 0 0 6px #845231,0 0 0 9px #2b190b,inset 0 0 0 2px rgba(0,0,0,.25),inset 0 0 60px rgba(0,0,0,.38),0 14px 30px rgba(0,0,0,.45);
  display:grid;gap:6px;grid-template-columns:minmax(0,var(--side)) minmax(0,1fr) minmax(0,var(--side));grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "left center right";--side:clamp(60px,13vw,150px);transform:perspective(1700px) rotateX(9deg);transform-origin:50% 100%}
.opp{display:flex;gap:5px;align-items:center;min-height:0;min-width:0;overflow:hidden}
.opp.p2{grid-area:top;justify-content:center;flex-wrap:wrap;gap:4px 12px}
.opp.p1,.opp.p3{flex-direction:column;justify-content:center}
.opp.p1{grid-area:right}.opp.p3{grid-area:left}
.who{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;background:rgba(0,0,0,.38);font-size:14px;line-height:1.2;max-width:100%;transition:box-shadow .2s}
.opp.p1 .who,.opp.p3 .who{flex-wrap:wrap;justify-content:center;border-radius:12px;padding:4px 6px;gap:2px 5px}
.opp.on .who,.mine.on .who{box-shadow:0 0 0 2px #ffd54a,0 0 16px rgba(255,213,74,.55)}
.who .nm{font-weight:700;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .sc{font-variant-numeric:tabular-nums;color:var(--on-dim)}
.wd{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:#fbf7ec;color:#1d1a14;font:900 14px/1 var(--serif)}
.wd.dealer{background:var(--red);color:#fff}
.ml{display:flex;flex-wrap:wrap;gap:3px 6px;align-items:flex-end}
.ml .g{display:flex;gap:1px}
.opp .ml{justify-content:center}
.opp .ml .t{--w:clamp(11px,1.9vw,22px)}
.opp .backs{display:flex;align-items:flex-end;gap:1px}
.opp.p2 .backs .st{--w:clamp(9px,1.7vw,20px)}
.opp.p1 .backs,.opp.p3 .backs{flex-direction:column;align-items:center;gap:1px}
.opp .backs .sd{--w:clamp(8px,min(2vw,3.1vh),24px)}
.opp .backs .gap{flex:none;width:6px;height:6px}
/* 中間：四家的牌河各自朝向自己，正中央是控制台 */
.center{grid-area:center;display:grid;gap:4px;min-height:0;
  grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);
  grid-template-areas:"rl rt rr" "rl info rr" "rl rb rr"}
.river{display:flex;flex-wrap:wrap;gap:2px 1px;border-radius:10px;padding:3px;min-height:0;min-width:0;overflow:hidden;align-content:flex-start}
.river .t{--w:clamp(13px,2.6vw,30px)}
.river.many .t{--w:clamp(11px,2vw,24px)}
.river.p0{grid-area:rb;flex-wrap:wrap-reverse;justify-content:center}
.river.p2{grid-area:rt;flex-direction:row-reverse;justify-content:center}
.river.p2 .t{transform:rotate(180deg)}
.river.p3{grid-area:rl;flex-direction:column;justify-content:center}
.river.p1{grid-area:rr;flex-direction:column-reverse;flex-wrap:wrap-reverse;justify-content:center}
.river.p3 .t{transform:rotate(90deg);margin:calc(var(--w)*-.15) calc(var(--w)*.17)}
.river.p1 .t{transform:rotate(-90deg);margin:calc(var(--w)*-.15) calc(var(--w)*.17)}
.river.on{background:rgba(255,213,74,.10)}
.info{grid-area:info;display:grid;place-items:center;gap:4px;text-align:center;align-content:center;padding:2px}
.dial{position:relative;width:clamp(70px,min(11vw,19vh),124px);aspect-ratio:1;border-radius:18%;background:linear-gradient(160deg,#3a2a1c,#1a120b);
  box-shadow:inset 0 0 0 2px rgba(255,213,74,.25),inset 0 2px 0 rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.45)}
.dial span{position:absolute;font:900 clamp(13px,min(2.2vw,3.8vh),22px)/1 var(--serif);color:rgba(246,241,226,.6)}
.dial span.on{color:#ffd54a;text-shadow:0 0 10px rgba(255,213,74,.8)}
.dial span.dl{color:var(--on)}
.dial .q0{bottom:7%;left:50%;transform:translateX(-50%)}.dial .q2{top:7%;left:50%;transform:translateX(-50%)}
.dial .q1{right:8%;top:50%;transform:translateY(-50%)}.dial .q3{left:8%;top:50%;transform:translateY(-50%)}
.dial b{position:absolute;inset:24%;display:grid;place-items:center;border-radius:14%;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,213,74,.3);
  font:700 clamp(14px,min(2.4vw,4vh),24px)/1 var(--sans);font-variant-numeric:tabular-nums;color:#ffd54a}
.dial b small{display:block;font-size:10px;font-weight:500;color:var(--on-dim);margin-top:2px}
.lastlog{font-size:13px;color:var(--on);min-height:1.4em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.5)}
/* 自己的牌 */
.mine{position:relative;padding:2px 10px calc(8px + env(safe-area-inset-bottom));display:grid;gap:4px}
.mine .top{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.mine .ml .t{--w:clamp(16px,3vw,30px)}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:2px;min-height:calc(var(--tw)*1.62);padding-top:calc(var(--tw)*.3);--tw:clamp(19px,calc((100vw - 34px)/18.2),56px)}
.hand .t{--w:var(--tw);transition:transform .12s}
.hand button.t:hover{transform:translateY(-8%)}
.hand .t.sel{transform:translateY(-24%)!important;box-shadow:0 0 0 calc(var(--w)*.05) #ffd54a,0 0 calc(var(--w)*.4) rgba(255,213,74,.75),var(--in),var(--edge)}
.hand .t.drawn{margin-left:calc(var(--tw)*.45)}
.hand.wait .t{cursor:default}
.hand.busy{opacity:.75}
.bar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;min-height:50px}
.msg{color:var(--on-dim);font-size:15px;text-align:center}
.msg b{color:var(--on)}
.timer{flex:0 0 100%;display:flex;justify-content:center;margin-top:2px}
.timer s{display:block;width:min(320px,70%);height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:#ffd54a;transition:width .25s linear}
.timer.low i{background:var(--red)}
/* 聽牌提示：要等的牌和還剩幾張 */
.ting{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1.5px rgba(255,213,74,.55);font-size:14px;color:#ffe9a8;font-weight:700}
.ting .tw{display:inline-flex;align-items:center;gap:3px}
.ting .tw .t{--w:20px;margin-bottom:3px}
.ting .tw i{font-style:normal;min-width:22px;height:20px;padding:0 5px;border-radius:99px;display:inline-grid;place-items:center;background:#ffd54a;color:#2a1406;font:700 13px/1 var(--sans)}
.ting .tw i.z{background:rgba(246,241,226,.25);color:var(--on-dim)}
.ting .tw.z .t{opacity:.5}
.ting small{font-size:13px;font-weight:500;color:var(--on-dim)}
.banner{background:rgba(0,0,0,.45);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}

/* ---------- overlays ---------- */
#ov:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(10,14,12,.55);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:18px 20px;width:min(620px,100%);max-height:calc(100dvh - 32px);overflow:auto;
  box-shadow:0 20px 50px rgba(0,0,0,.45);display:grid;gap:12px}
.card h2{font-size:clamp(26px,5vw,36px)}
.card .sub{color:var(--muted);margin:-6px 0 0}
.wh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end;padding:10px;border-radius:14px;background:var(--felt);}
.wh .t{--w:clamp(18px,4.4vw,34px)}
.tai{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;margin:0;padding:0;list-style:none}
.tai li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.tai li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{font-family:var(--serif);font-weight:900;font-size:20px}
table.pay{width:100%;border-collapse:collapse;font-size:15px}
.pay td,.pay th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.pay th{font-weight:500;color:var(--muted);font-size:13px}
.pay .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:#1d7a56}.neg{color:var(--red)}
:root[data-theme=dark] .pos{color:#5fd39c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pos{color:#5fd39c}}
.card .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.card details summary{cursor:pointer;color:var(--muted);font-size:14px}
.reveal{display:grid;gap:6px;margin-top:8px}
.reveal div{display:flex;gap:2px;flex-wrap:wrap;align-items:center;font-size:13px}
.reveal .t{--w:16px}
.rules h3{font-size:17px;margin-top:4px}
.rules ul{margin:0;padding-left:1.2em;font-size:15px}
.rules table{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:3px 4px;border-bottom:1px dashed var(--line)}
.rules td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.menu{width:min(360px,100%)}
.menu .btn{width:100%;justify-content:flex-start}
.menu .mh{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px -2px 0}
.xb{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:30px;line-height:1;display:grid;place-items:center}
.xb:hover{background:var(--line)}
.nick{width:100%;min-height:48px;font:500 18px/1.2 var(--sans);padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.nick:focus-visible{outline:3px solid #ffd54a;outline-offset:1px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1a14;color:#fbf7ec;padding:10px 16px;border-radius:12px;z-index:30;font-size:15px;max-width:90vw;box-shadow:0 8px 20px rgba(0,0,0,.35)}

/* ---------- 特效：碰槓吃大字、胡牌流程 ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:15;display:grid;place-items:center}
#fx:empty{display:none}
.fx{display:flex;flex-direction:column;align-items:center;margin-top:-10vh;animation:fxin 1.1s ease-out forwards}
.fx .burst{width:min(420px,68vw,62vh);height:auto}
.fxsub{margin-top:-5%;padding:5px 14px;border-radius:99px;background:rgba(0,0,0,.62);color:#fff;font:700 16px var(--sans)}
.burst .rays{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{rotate:360deg}}
@keyframes fxin{0%{scale:.3;opacity:0}16%{scale:1.12;opacity:1}28%{scale:1}78%{opacity:1}100%{opacity:0;scale:1.04}}
@keyframes fxpop{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
@keyframes fxup{from{translate:0 14px;opacity:0}to{translate:none;opacity:1}}
@keyframes stampin{from{scale:2.4;opacity:0}to{scale:1;opacity:1}}
.fxov{background:rgba(6,14,10,.42);cursor:pointer}
.fxov.s2{background:rgba(6,14,10,.74)}
.fxst{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.fxov.s1 .burst{width:min(520px,86vw,72vh);height:auto;animation:fxpop .5s cubic-bezier(.2,.9,.3,1.25) both}
.fxov.s2 .burst{width:min(640px,90vw,90vh);height:auto;animation:fxpop .5s cubic-bezier(.2,.9,.3,1.25) both}
.fxwho{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;padding:6px 16px;border-radius:99px;background:rgba(0,0,0,.58);box-shadow:inset 0 0 0 1.5px rgba(255,213,74,.6);color:#f6f1e2;font:500 16px var(--sans);animation:fxup .4s .15s both}
.fxwho b{font:900 20px var(--serif);color:#fff}
.bdg{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font:700 12px/1.3 var(--sans);background:#ffd54a;color:#2a1406;white-space:nowrap}
.bdg.red{background:var(--red);color:#fff}
.fxhand{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;align-items:flex-end;animation:fxup .4s .25s both}
.fxhand .g{display:flex;gap:1px}
.fxhand .t{--w:clamp(20px,min(4.2vw,7vh),44px)}
.pw{position:relative}
.stamp{position:absolute;right:1%;top:8%;width:clamp(52px,min(9vw,16vh),96px);aspect-ratio:1;box-sizing:border-box;border:max(3px,.4vw) solid #d6262f;border-radius:14%;background:rgba(255,250,240,.94);color:#d6262f;
  display:flex;align-items:center;justify-content:center;rotate:-10deg;box-shadow:0 6px 18px rgba(0,0,0,.4);font:900 clamp(22px,min(4.2vw,7.5vh),44px)/1 var(--serif);animation:stampin .45s .35s cubic-bezier(.2,.9,.3,1.3) both}
.stamp small{font-size:.6em;margin-left:2px}
.fxgroups{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:min(1100px,96vw);animation:fxup .4s .2s both}
.gb{display:flex;gap:1px;padding:6px 6px 2px;border-radius:12px;background:rgba(246,241,226,.08);box-shadow:inset 0 0 0 2px rgba(246,241,226,.35)}
.gb.hot{background:rgba(255,213,74,.16);box-shadow:inset 0 0 0 2px #ffd54a,0 0 18px rgba(255,213,74,.45)}
.fxgroups .t{--w:clamp(18px,min(3.6vw,6.5vh),50px)}
.fxdesc{font:500 clamp(14px,2vw,18px)/1.4 var(--sans);color:#f6f1e2;text-align:center;animation:fxup .4s .3s both}
.fxskip{font-size:12px;color:var(--on-dim)}
/* 結算表 */
.res{width:min(960px,100%);max-height:calc(100dvh - 24px);overflow:auto;border-radius:18px;padding:20px 26px 22px;display:grid;gap:14px;color:#f6f1e2;
  background:linear-gradient(180deg,#3a2414 0%,#24160b 100%);box-shadow:inset 0 0 0 1px rgba(255,213,74,.35),0 20px 60px rgba(0,0,0,.55)}
.res .rh{display:flex;align-items:center;gap:14px}
.res .rh .burst{width:clamp(88px,14vw,150px);height:auto;flex:none}
.res .rt{flex:1;display:grid;gap:6px}
.res h2{font-size:clamp(24px,3.4vw,34px);color:#fff}
.res .bds{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--on-dim)}
.res .tot{text-align:right;line-height:1.05;flex:none}
.res .tot b{font:900 clamp(36px,6vw,60px)/1 var(--serif);color:#ffd54a}
.res .tot b small{font-size:.45em;margin-left:3px}
.res .tot span{display:block;font-size:14px;color:var(--on-dim);margin-top:4px}
.res .hb{padding:10px 12px 4px;border-radius:12px;background:rgba(0,0,0,.28)}
.res .wh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:flex-end}
.res .wh .g{display:flex;gap:1px}
.res .wh .t{--w:clamp(18px,3.4vw,40px)}
.res .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.res h3{font-size:17px;color:#f6f1e2;margin-bottom:4px}
.res .tai{display:grid;margin:0;padding:0;list-style:none}
.res .tai li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(246,241,226,.18);font-size:15px}
.res .tai li.hot{color:#ffd54a;font-weight:700}
.res .tai li small{font-size:12px;color:var(--on-dim);font-weight:500}
.res .tai li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.res .sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font:900 19px var(--serif);color:#ffd54a}
.res .fm,.res .nx{font-size:14px;color:var(--on-dim);margin:4px 0 0}
.res table.pay{font-size:15px}
.res .pay td,.res .pay th{border-bottom:1px solid rgba(246,241,226,.12)}
.res .pay th{color:var(--on-dim)}
.res .pay tr.me{background:rgba(255,213,74,.10)}
.res .pn{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.res .pay .n{font-family:var(--serif);font-weight:900}
.res .pos{color:#7fe0a6}.res .neg{color:#ff9a8f}
.res details summary{cursor:pointer;color:var(--on-dim);font-size:14px}
.res .reveal div{display:flex;gap:2px;flex-wrap:wrap;align-items:center;font-size:13px}
.res .reveal b{min-width:5em}
.res .reveal .t{--w:18px}
.res .small{color:var(--on-dim)}
.res .foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
@media (max-width:700px){.res{padding:16px}.res .cols{grid-template-columns:1fr;gap:12px}.res .rh{flex-wrap:wrap}}

/* ---------- 聽牌宣告與貼圖 ---------- */
.tag.tg{background:#ffd54a;color:#2a1406;font-weight:700}
.btn.tgb{background:linear-gradient(#ffb36b,#e0742a);color:#2a1406;box-shadow:0 3px 0 #9a4a14}
.hand.locked .t:not(button){filter:brightness(.88) saturate(.9)}
#stk{position:fixed;inset:0;pointer-events:none;z-index:16}
.stkb{position:fixed;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:stkpop 3.2s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes stkpop{0%{scale:.2;opacity:0}10%{scale:1.08;opacity:1}16%{scale:1}85%{opacity:1;scale:1}100%{opacity:0;scale:.92}}
.sg{position:relative;border:0;padding:0;min-height:0;overflow:hidden;border-radius:12px;background:#f6f1e2;box-shadow:0 2px 0 #b8a983}
.sg:hover{background:#ffe9a8}
.stkov{background:rgba(10,14,12,.35)}
.stkpanel{width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:14px;border-radius:18px;background:linear-gradient(180deg,#3a2414,#24160b);box-shadow:inset 0 0 0 1px rgba(255,213,74,.35),0 20px 50px rgba(0,0,0,.5);display:grid;gap:10px;justify-items:end}
.stkgrid{display:grid;gap:8px;width:100%}
.sgA,.sgB{display:grid;gap:8px}
.sgA{grid-template-columns:repeat(4,minmax(0,1fr))}.sgB{grid-template-columns:repeat(2,minmax(0,1fr))}
.sgA .sg{aspect-ratio:1}.sgB .sg{aspect-ratio:16/9}
.sg img{position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);object-fit:contain}

/* ---------- 登入與房間（Firebase 版） ---------- */
#gate{position:fixed;inset:0;z-index:40;overflow:auto;justify-content:flex-start}
.gate h1{font-size:clamp(30px,5vw,44px);text-align:center;margin-top:clamp(8px,4vh,40px)}
.gp{width:min(420px,100%);gap:14px}
.gp h3{font-size:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);padding:4px;border-radius:12px}
.tab{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:16px;color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.fld{display:grid;gap:5px}
.fld>span{font-size:14px;font-weight:700;color:var(--ink)}
.fld small{font-size:12.5px;color:var(--muted)}
.gerr{margin:0;padding:8px 12px;border-radius:10px;background:rgba(196,38,46,.12);color:var(--red);font-size:14px;font-weight:700}
.gmsg{margin:0;font-size:14px;color:var(--muted)}
.glinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lnk{border:0;background:none;padding:8px 2px;min-height:40px;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ghi{margin:0;font-size:17px}.ghi small{color:var(--muted);font-size:13px;margin-left:4px}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.recent{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.recent>span{width:100%;font-size:13px;color:var(--muted)}
.roombox{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:99px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1.5px rgba(255,213,74,.5)}
.roombox span{font-size:14px;color:var(--on-dim)}.roombox b{font:900 24px/1 var(--serif);letter-spacing:.08em;color:#ffd54a}

/* ---------- 圖示列、排行榜、個人資料 ---------- */
.licons{display:flex;gap:8px;align-self:flex-end;order:-1;margin-bottom:-10px}
.gate .gicons~h1,.gate h1{margin-top:0}
#sheet{z-index:50}
.sheetc{width:min(560px,100%)}
.sheetc .mh{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px -2px 0}
.tabs.t3{grid-template-columns:repeat(3,1fr)}
.myrk{margin:0;font-size:15px}.myrk b{color:var(--red);font-size:18px}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rk li{display:grid;grid-template-columns:2.2em 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.rk li:nth-child(odd){background:var(--line)}
.rk li.me{box-shadow:inset 0 0 0 2px #d6a000;background:rgba(255,213,74,.18)}
.rk .no{font:900 18px/1 var(--serif);text-align:center;color:var(--muted)}
.rk li:nth-child(1) .no{color:#c99700}.rk li:nth-child(2) .no{color:#8a96a0}.rk li:nth-child(3) .no{color:#b06a2a}
.rk .nm{display:grid;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm small{font-weight:500;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}

const steps = list => `<ol class="isteps">${list.map(x => `<li><span>${x}</span></li>`).join('')}</ol>`;
function openInstall(tab) {

  if (installed()) { showSheet(sheetHead('安裝到桌面') + '<p class="inst-ok">你現在就是從桌面圖示打開的，已經安裝好了。</p>'); return; }

  let body;
  if (inApp && !tab) body = `<div class="inapp"><b>現在是在 ${inApp} 裡面打開的</b><p>${inApp} 裡面沒辦法安裝，請先換成${isIOS ? ' Safari' : '手機的瀏覽器（例如 Chrome）'}打開：</p>

    <button type="button" class="btn ghost sm" data-copylink>複製網址</button></div>`;
  else if (plat === 'ios') body = steps([`用 <b>Safari</b> 打開這個網站，點下方的「分享」<span class="ki">${IC.share}</span>`, `往下滑，點「加入主畫面」<span class="ki">${IC.add}</span>`, '右上角點「加入」，桌面就會出現「十六張麻將」']) +

  else body = (installEvt ? '<button type="button" class="btn red ibig" data-install-now>一鍵安裝到桌面</button><p class="small">按了之後在跳出的視窗點「安裝」。沒有反應的話，照下面的步驟做：</p>' : '') +
    steps([`用 <b>Chrome</b> 打開這個網站，點右上角的 <span class="ki">${IC.dots}</span>`, '點「安裝應用程式」（有些手機叫「加到主畫面」）', '再點「安裝」，桌面就會出現「十六張麻將」']) +
    '<p class="small">三星瀏覽器：下方選單 → 新增頁面至 → 主螢幕。</p>';
  showSheet(sheetHead('安裝到桌面') + `<div class="inst"><div class="ihero"><img src="icon-192.png" alt="" width="64" height="64"><p>加到手機桌面以後，點圖示就直接打開，<b>橫放是全螢幕</b>，沒有網址列，牌也比較大。</p></div>${tabs}${body}
    <p class="small inote">從桌面圖示打開的時候，第一次要再登入一次。朋友傳來的邀請連結還是會用瀏覽器打開。</p></div>`);
}
document.addEventListener('click', async e => {
  const t = e.target.closest('#sheet [data-inst], #sheet [data-install-now], #sheet [data-copylink]'); if (!t) return;
  if (t.dataset.inst) openInstall(t.dataset.inst);
  else if (t.hasAttribute('data-copylink')) { try { await navigator.clipboard.writeText(location.origin + location.pathname); t.textContent = '已複製，貼到瀏覽器打開'; } catch (x) { t.textContent = location.origin + location.pathname; } }
  else if (installEvt) { const ev = installEvt; installEvt = null; try { await ev.prompt(); await ev.userChoice; } catch (x) { /* ignore */ } openInstall('android'); }
});
window.mjPanels = { profile: () => openProfile(false), ranking: () => openRanking('hu'), install: () => openInstall() };
const toggleRec = li => { const x = li.querySelector('.ex7'); if (!x) return; x.hidden = !x.hidden; li.classList.toggle('op', !x.hidden); li.setAttribute('aria-expanded', String(!x.hidden)); };
document.addEventListener('keydown', e => { const li = (e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('#sheet [data-rec]'); if (li) { e.preventDefault(); toggleRec(li); } });
document.addEventListener('click', e => {
  const li = e.target.closest('#sheet [data-rec]'); if (li) { toggleRec(li); return; }
  const t = e.target.closest('#sheet [data-rank], #sheet [data-prof]'); if (!t) return;

document.addEventListener('submit', e => { const f = e.target; if (f.matches && f.matches('#sheet [data-rename]')) { e.preventDefault(); doRename(f); } });

const qRoom = new URLSearchParams(location.search).get('room');
if (qRoom && ROOM_RE.test(qRoom)) wantRoom = qRoom;

async function loadMe(u) {
  ME.uid = u.uid;
  const em = String(u.email || '').toLowerCase();
  ME.user = em.endsWith(SYN) ? em.slice(0, -SYN.length) : '';
  try { const p = (await get(ref(db, `data/users/${u.uid}/profile`))).val(); if (p && typeof p.u === 'string') ME.user = p.u; } catch (e) { /* 沒有權限或還沒建立 */ }
  try { const n = (await get(ref(db, `names/${u.uid}`))).val(); if (typeof n === 'string') ME.nick = n; } catch (e) { /* ignore */ }
  if (!ME.nick) ME.nick = ME.user;
}
async function afterLogin(u) {
  await loadMe(u);
  if (wantRoom) { const c = wantRoom; wantRoom = null; return joinRoom(c); }
  V.rooms('', gateMsg());
}
async function joinRoom(code) {
  if (!ROOM_RE.test(code)) return V.rooms('房號是 6 位數字。');
  let ok = false;
  try { ok = (await get(ref(db, `rooms/${code}/meta`))).exists(); } catch (e) { return V.rooms('暫時讀不到房間資料，請確認網路後再試。'); }
  if (!ok) return V.rooms(`找不到房號 ${code}，請確認號碼是否正確。`);
  return enterRoom(code, false);
}
async function createRoom() {
  for (let i = 0; i < 8; i++) {
    const code = String(100000 + Math.floor(Math.random() * 900000));
    try {
      const r = await runTransaction(ref(db, `rooms/${code}/meta`), cur => cur ? undefined : { by: ME.uid, name: ME.nick || ME.user || '', at: Date.now() });
      if (r.committed) return enterRoom(code, true);
    } catch (e) { return V.rooms('建立房間失敗，請確認網路後再試。'); }
  }
  V.rooms('建立房間失敗，請再試一次。');
}
async function enterRoom(code, fresh) {
  ROOM = code; rememberRoom(code);
  try { history.replaceState(null, '', location.pathname + '?room=' + code); } catch (e) { /* ignore */ }
  hideGate();
  await startAdapter(fresh);
}
// 回到登入後的選房間畫面（可以帶一句說明，例如「牌桌已經解散」）
const leave = msg => {
  const line = msg && /解散/.test(msg) ? '牌桌已經解散，正在回到選房間畫面…' : '正在回到選房間畫面…';
  try { if (msg) sessionStorage.setItem('mj-gate-msg', msg); sessionStorage.setItem('mj-splash', line); } catch (e) { /* ignore */ }
  if (window.mjSplash) window.mjSplash(line);
  location.href = location.pathname;
};
window.mjToGate = leave;
const gateMsg = () => { try { const m = sessionStorage.getItem('mj-gate-msg') || ''; sessionStorage.removeItem('mj-gate-msg'); return m; } catch (e) { return ''; } };
const clearSplash = () => { try { sessionStorage.removeItem('mj-splash'); } catch (e) { /* ignore */ } };

function say(f, err, msg) {
  if (!f || !f.isConnected) return V.login(err, msg);
  f.querySelectorAll('.gerr, .gmsg').forEach(n => n.remove());
  const p = document.createElement('p'); p.className = err ? 'gerr' : 'gmsg'; p.setAttribute('role', err ? 'alert' : 'status'); p.textContent = err || msg;
  const b = [...f.children].find(x => x.matches && x.matches('[type=submit]'));
  f.insertBefore(p, b || null);
}
async function doLogin(f) {
  const id = f.id.value.trim().toLowerCase(), pw = f.pw.value;
  if (!id || !pw) return say(f, '請輸入帳號和密碼。');
  const email = id.includes('@') ? id : id + SYN;
  try { const c = await signInWithEmailAndPassword(auth, email, pw); await afterLogin(c.user); }
  catch (e) { say(f, authMsg(e) + (id.includes('@') ? '' : '（註冊時有填 Email 的話，也可以改用 Email 登入。）')); }
}
async function doRegister(f) {
  const user = f.user.value.trim().toLowerCase(), pw = f.pw.value, pw2 = f.pw2.value;
  const nick = f.nick.value.replace(/\s+/g, ' ').trim().slice(0, 12), email = f.email.value.trim();
  if (!USER_RE.test(user)) return say(f, '帳號只能用英文小寫、數字或底線，3–16 個字。');
  if (pw.length < 6) return say(f, '密碼至少要 6 個字。');
  if (pw !== pw2) return say(f, '兩次輸入的密碼不一樣。');
  if (!nick) return say(f, '請填暱稱，這是牌桌上大家看到的名字。');
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say(f, 'Email 格式不對。');
  try { if ((await get(ref(db, 'usernames/' + user))).exists()) return say(f, '這個帳號已經有人用了，請換一個。'); } catch (e) { /* 交給下面的交易判斷 */ }
  let cred;
  try { cred = await createUserWithEmailAndPassword(auth, email || user + SYN, pw); }
  catch (e) { return say(f, /email-already-in-use/.test(String(e && e.code)) && !email ? '這個帳號已經有人用了，請換一個。' : authMsg(e)); }
  const u = cred.user;
  try {
    const r = await runTransaction(ref(db, 'usernames/' + user), cur => (cur && cur !== u.uid) ? undefined : u.uid);
    if (!r.committed) { try { await u.delete(); } catch (e) { /* ignore */ } return say(f, '這個帳號已經有人用了，請換一個。'); }
    await set(ref(db, `data/users/${u.uid}/profile`), { u: user, e: !!email });
    await set(ref(db, `names/${u.uid}`), nick);
    try { localStorage.setItem('mj-nick', nick); } catch (e) { /* ignore */ }
  } catch (e) { return say(f, '帳號建立了，但資料寫入失敗（' + String((e && e.code) || e) + '），請重新整理後登入。'); }
  await afterLogin(u);
}
async function doForgot(f) {
  const email = f.email.value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say(f, '請輸入註冊時填的 Email。');
  try { await sendPasswordResetEmail(auth, email); say(f, '', '如果這個 Email 有註冊，重設密碼的信已經寄出了，請到信箱收信（也看一下垃圾郵件）。'); }
  catch (e) { say(f, authMsg(e)); }
}
function wireGate() {
  document.addEventListener('submit', async e => {
    const f = e.target; if (!gate || !gate.contains(f)) return;
    e.preventDefault(); if (busy) return; busy = true;
    const b = f.querySelector('[type=submit]'), label = b ? b.textContent : ''; if (b) { b.disabled = true; b.textContent = '處理中…'; }
    try {
      const k = f.dataset.f;
      if (k === 'login') await doLogin(f); else if (k === 'register') await doRegister(f); else if (k === 'forgot') await doForgot(f);
      else if (k === 'join') await joinRoom(f.code.value.trim());
    } finally { busy = false; if (b && b.isConnected) { b.disabled = false; b.textContent = label; } }
  });
  document.addEventListener('click', async e => {
    const b = e.target.closest('#gate [data-go], #gate [data-room]'); if (!b || busy) return;
    if (b.dataset.room) { busy = true; try { await joinRoom(b.dataset.room); } finally { busy = false; } return; }
    const g = b.dataset.go;
    if (g === 'login' || g === 'register' || g === 'forgot') V[g]();
    else if (g === 'ranking') openRanking('hu');
    else if (g === 'install') openInstall();
    else if (g === 'profile') openProfile(false);
    else if (g === 'create') { busy = true; b.disabled = true; b.textContent = '建立中…'; try { await createRoom(); } finally { busy = false; } }
    else if (g === 'logout') { try { await signOut(auth); } catch (x) { /* ignore */ } leave(); }
    else if (g === 'local') { hideGate(); window.mjLocalOnly = true; finish(); } // 直接開始單機練習
  });
}

/* ---------- 進入房間後：提供遊戲需要的資料庫、身分、在線名單 ---------- */
function roomPath(path) {
  const p = String(path);
  if (/^(mj|mjp)(\/|$)/.test(p)) return `rooms/${ROOM}/${p}`;
  const m = /^data\/users\/([^/]+)\/mjsave$/.exec(p);
  if (m) return `data/users/${m[1]}/rooms/${ROOM}/mjsave`;
  return p;
}
async function startAdapter(fresh) {
  const uid = ME.uid;
  /* ---- 連線狀態、伺服器時間 ---- */
  let connected = false, offset = 0;
  onValue(ref(db, '.info/serverTimeOffset'), s => { offset = Number(s.val()) || 0; });

  /* ---- 在線偵測：伺服器在斷線時自動刪掉自己的 presence ---- */
  let peers = [];
  const peerFns = new Set();
  const emitPeers = () => { for (const f of peerFns) f({ peers, joined: [], left: [], updated: [] }); };
  onValue(ref(db, '.info/connected'), s => {
    connected = s.val() === true;
    if (connected) {
      const me = push(ref(db, `rooms/${ROOM}/presence/` + uid));
      onDisconnect(me).remove().then(() => set(me, serverTimestamp())).catch(() => {});
    }
    window.dispatchEvent(new Event('mj-conn'));
  });
  onValue(ref(db, `rooms/${ROOM}/presence`), s => {
    const v = s.val() || {};
    peers = Object.keys(v).map(by => ({ by, peer: by, isMe: by === uid, presence: {}, kind: 'viewer', guest: false }));
    emitPeers();
  }, () => {});

  /* ---- 暱稱 ---- */
  let names = {}, myName = ME.nick || '', renamed = false;
  onValue(ref(db, 'renamed/' + uid), s => { renamed = s.val() === true; window.dispatchEvent(new Event('mj-names')); }, () => {});
  onValue(ref(db, 'names'), s => { names = s.val() || {}; window.dispatchEvent(new Event('mj-names')); }, () => {});
  const user = {
    id: async () => uid,
    can: async () => true, isOwner: async () => false, canEdit: async () => false,
    me: async () => ({ id: uid, name: names[uid] || myName }),
    profiles: async ids => Object.fromEntries([...new Set([].concat(ids))].map(id => [id, { id, name: typeof names[id] === 'string' ? names[id] : '', isMe: id === uid }])),
    getName: () => (typeof names[uid] === 'string' && names[uid]) || myName,
    canRename: () => !renamed,
    async setName(n) {
      n = String(n).replace(/\s+/g, ' ').trim().slice(0, 12);
      if (!n) return;
      if (renamed) throw new Error('already renamed');
      await update(ref(db), { ['names/' + uid]: n, ['renamed/' + uid]: true });
      myName = n; names = { ...names, [uid]: n }; renamed = true;
      try { localStorage.setItem('mj-nick', n); } catch (e) { /* in-memory only */ }
    },
  };

  /* ---- 文件式資料庫介面 ---- */
  const mapErr = e => ({ code: /permission/i.test(String((e && (e.code || e.message)) || e)) ? 'invalid_argument' : 'unavailable', message: String((e && e.message) || e) });
  const dec = v => (v && typeof v.j === 'string') ? JSON.parse(v.j) : null;
  const snapOf = (path, v) => { const d = dec(v); return { id: path.split('/').pop(), exists: d != null, data: () => (d == null ? undefined : d), metadata: { fromCache: false, hasPendingWrites: false } }; };
  const wrap = async p => { try { return await p; } catch (e) { throw mapErr(e); } };
  function docRef(path) {
    const r = ref(db, roomPath(path));
    return {
      id: path.split('/').pop(), path,
      get: async () => snapOf(path, (await wrap(get(r))).val()),
      set: d => wrap(set(r, { j: JSON.stringify(d) })),
      update: async d => { const cur = dec((await wrap(get(r))).val()); if (!cur) throw { code: 'invalid_argument', message: 'missing' }; await wrap(set(r, { j: JSON.stringify({ ...cur, ...d }) })); },
      delete: () => wrap(remove(r)),
      async acquire({ holder, ttlMs }) {
        const now = Date.now() + offset, ttl = Math.min(600000, Math.max(1000, ttlMs || 30000));
        const res = await wrap(runTransaction(r, cur => (!cur || typeof cur !== 'object' || !(cur.exp > now) || cur.holder === holder) ? { holder, exp: now + ttl } : undefined));
        return { acquired: !!res.committed };
      },
      onSnapshot(next, err) { return onValue(r, s => next(snapOf(path, s.val())), e => err && err(mapErr(e))); },
      collection: sub => coll(path + '/' + sub),
    };
  }
  function coll(path) {
    const r = ref(db, roomPath(path));
    const list = v => Object.keys(v || {}).map(id => snapOf(path + '/' + id, v[id])).filter(d => d.exists);
    return {
      path, doc: id => docRef(path + '/' + id),
      async get() { const docs = list((await wrap(get(r))).val()); return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false } }; },
      onSnapshot(next, err) {
        let prev = {};
        return onValue(r, s => {
          const v = s.val() || {}, cur = {}, changes = [];
          for (const id of Object.keys(v)) cur[id] = JSON.stringify(v[id]);
          for (const id in cur) if (prev[id] !== cur[id]) { const d = snapOf(path + '/' + id, v[id]); if (d.exists) changes.push({ type: prev[id] ? 'modified' : 'added', doc: d }); }
          for (const id in prev) if (!(id in cur)) changes.push({ type: 'removed', doc: snapOf(path + '/' + id, JSON.parse(prev[id])) });
          prev = cur;
          if (changes.length) next({ docs: list(v), size: Object.keys(v).length, empty: !Object.keys(v).length, docChanges: () => changes, metadata: { fromCache: false } });
        }, e => err && err(mapErr(e)));
      },
    };
  }
  const DB = { doc: docRef, collection: coll };

  /* ---- 即時通道：Firebase 本身就會即時推送，這裡只提供在線名單 ---- */
  const room = {
    presence: async () => {},
    onPeers(fn) { peerFns.add(fn); setTimeout(() => fn({ peers, joined: [], left: [], updated: [] }), 0); return () => peerFns.delete(fn); },
    on: () => () => {},
    emit: async () => {},
    connected: () => connected,
  };

  window.claude = {
    features: { site: true, push: true, presence: true, nickname: true },
    use: async n => (n === 'db' ? DB : n === 'user' ? user : n === 'room' ? room : null),
  };
  window.mjAccount = {
    room: ROOM, user: ME.user, fresh: !!fresh,
    canRename: () => user.canRename(),
    link: location.origin + location.pathname + '?room=' + ROOM,
    leaveRoom: msg => leave(msg),
    async logout() { try { await signOut(auth); } catch (e) { /* ignore */ } leave(); },
  };
  finish();
}

try {
  const app = initializeApp(CONFIG);
  auth = getAuth(app); auth.languageCode = 'zh-TW';
  db = getDatabase(app);
  wireGate();
  const u = await new Promise((resolve, reject) => { const stop = onAuthStateChanged(auth, x => { stop(); resolve(x); }, reject); });
  if (u && !u.isAnonymous) await afterLogin(u);
  else V.login('', wantRoom ? `登入後會直接進入房號 ${wantRoom}。` : gateMsg());
} catch (e) { fail(e); }

</script>
<script>
/* 台灣十六張麻將 規則引擎 — 純邏輯，無 DOM。牌以 0..41 表示：
   0-8 萬、9-17 筒、18-26 條、27-30 東南西北、31-33 中發白、34-41 春夏秋冬梅蘭竹菊 */
(function (root) {
'use strict';
const RESERVE = 16;
const NUM = '一二三四五六七八九';
const HONN = ['東風', '南風', '西風', '北風', '紅中', '青發', '白板'];
const FLW = '春夏秋冬梅蘭竹菊';
const WIND = '東南西北';
const E = { rng: Math.random };

function tname(k) {
  if (k < 9) return NUM[k] + '萬';
  if (k < 18) return NUM[k - 9] + '筒';
  if (k < 27) return NUM[k - 18] + '條';
  if (k < 34) return HONN[k - 27];
  return FLW[k - 34];
}
const isFlower = k => k >= 34;
function rmOne(a, k) { const i = a.indexOf(k); if (i < 0) return false; a.splice(i, 1); return true; }
function countOf(a, k) { let n = 0; for (const x of a) if (x === k) n++; return n; }
function cnt(a) { const c = new Array(34).fill(0); for (const k of a) if (k < 34) c[k]++; return c; }
function sortTiles(a) { return a.slice().sort((x, y) => x - y); }

function newWall() {
  const w = [];
  for (let k = 0; k < 34; k++) for (let i = 0; i < 4; i++) w.push(k);
  for (let k = 34; k < 42; k++) w.push(k);
  for (let i = w.length - 1; i > 0; i--) { const j = Math.floor(E.rng() * (i + 1)); [w[i], w[j]] = [w[j], w[i]]; }
  return w;
}

/* ---------- 胡牌判定 ---------- */
function setsOK(c) {
  let i = 0; while (i < 34 && c[i] === 0) i++;

  try { await ref.set(data); return true; } catch (e) {
    let err = e;
    if (err && err.code === 'unavailable') { await sleep(300 + Math.random() * 500); try { await ref.set(data); return true; } catch (e2) { err = e2; } }

/* ================= 端對端加密（各家手牌只有本人與房主看得到） ================= */
const b64 = u => { let s = ''; for (const x of u) s += String.fromCharCode(x); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ALG = { name: 'ECDH', namedCurve: 'P-256' };
const Keys = {
  priv: null, pub: null, plain: false, cache: new Map(),
  async init() {
    const sub = window.crypto && crypto.subtle;
    if (!sub) { this.plain = true; this.pub = { plain: true }; return; }
    try {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem('mj-ecdh') || 'null'); } catch (e) { /* storage blocked */ }
      if (saved && saved.priv && saved.pub) {
        this.priv = await sub.importKey('jwk', saved.priv, ALG, false, ['deriveKey']); this.pub = saved.pub; return;
      }
      const kp = await sub.generateKey(ALG, true, ['deriveKey']);
      const pj = await sub.exportKey('jwk', kp.publicKey), sj = await sub.exportKey('jwk', kp.privateKey);
      this.priv = kp.privateKey; this.pub = { kty: 'EC', crv: 'P-256', x: pj.x, y: pj.y };
      try { localStorage.setItem('mj-ecdh', JSON.stringify({ priv: sj, pub: this.pub })); } catch (e) { /* in-memory only */ }
    } catch (e) { this.plain = true; this.pub = { plain: true }; }
  },
  key(pub) {
    const id = pub.x + '.' + pub.y;
    if (!this.cache.has(id)) {
      const p = crypto.subtle.importKey('jwk', { kty: 'EC', crv: 'P-256', x: pub.x, y: pub.y }, ALG, false, [])
        .then(pk => crypto.subtle.deriveKey({ name: 'ECDH', public: pk }, this.priv, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']));
      p.catch(() => this.cache.delete(id));
      this.cache.set(id, p);
    }
    return this.cache.get(id);
  },
  async seal(pub, obj) {
    if (this.plain || !pub || pub.plain) return { plain: obj };
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await this.key(pub), new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: b64(iv), ct: b64(new Uint8Array(ct)) };
  },
  async open(pub, box) {
    if (!box) return null;
    if (box.plain) return box.plain;
    if (this.plain || !pub || pub.plain) return null;
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, await this.key(pub), unb64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  },
};

/* 玩家動作：同一位玩家依序處理；即時通道與資料庫兩條路都會送到，用序號去重 */

  Host.chain[uid] = prev.then(async () => {
    const list = items.filter(q => q && typeof q.n === 'number').sort((x, y) => x.n - y.n);

function updateTimers() {
  const left = App.dlAt - Date.now(), f = Math.max(0, Math.min(1, left / App.dlMax));
  const V = App.V, o = V && V.priv && V.priv.opts, g = V && V.game;
  if (g && g.phase === 'play' && o && (o.turn || o.claim) && !g.auto[V.mySeat] && App.dlMax >= 4000 && !myPending(V)) {
    const sec = Math.ceil(left / 1000); if (sec >= 1 && sec <= 3 && sec !== App.tickSec) { App.tickSec = sec; Snd.play('tick'); }
  } else App.tickSec = 0;
  for (const el of document.querySelectorAll('.timer')) { el.querySelector('i').style.width = (f * 100).toFixed(1) + '%'; el.classList.toggle('low', left < 4000); }
  for (const el of document.querySelectorAll('[data-secs]')) el.textContent = Math.max(0, Math.ceil(left / 1000));
}

}

function currentTiles() { const V = App.V; return V && V.priv ? handTiles(V.priv).tiles : []; }
function onClick(e) {
  const b = e.target.closest('[data-a]');
  if (!b) { if (e.target.classList && e.target.classList.contains('ov') && (App.ov === 'rules' || App.ov === 'menu' || App.ov === 'stk' || App.ov === 'custom')) { App.ov = null; render(); } return; }
  if (b.disabled) return;
  const a = b.dataset.a, d = b.dataset, V = App.V;
  switch (a) {
    case 'create': if (needNick()) { App.ov = 'nick'; render(); break; } createTable(); break;
    case 'nick': if (window.mjAccount && (!window.mjAccount.canRename() || !App.V || App.V.screen !== 'lobby')) break; App.ov = 'nick'; render(); setTimeout(() => { const el = document.getElementById('nick-in'); if (el) el.focus(); }, 50); break;
    case 'nick-save': saveNick(); break;
    case 'local': startLocal(); break;
    case 'sit': if (needNick()) { App.ov = 'nick'; render(); break; } send({ t: 'sit', s: +d.s }); break;
    case 'stand': send({ t: 'stand' }); break;
    case 'bot': if (Host.on && !Host.lobby.seats[+d.s]) { Host.lobby.seats[+d.s] = { bot: true }; Host.commit(); } break;
    case 'unseat': if (Host.on && !Host.G) { Host.lobby.seats[+d.s] = null; Host.commit(); } break;
    case 'cfg': if (Host.on && !Host.G) { const c = { ...Host.lobby.cfg }; if (d.b) { c.base = +d.b; c.per = +d.p; } if (d.r) c.rounds = +d.r; if (d.t) c.turnMs = c.claimMs = okThink(+d.t); Host.lobby.cfg = c; Host.commit(); } break;
    case 'cfgcustom': if (Host.on && !Host.G) { App.ov = 'custom'; render(); setTimeout(() => { const el = document.getElementById('cb-base'); if (el && matchMedia('(pointer:fine)').matches) el.focus(); }, 50); } break;
    case 'cfgcustom!': saveCustom(); break;
    case 'lready': send({ t: 'lready', on: d.on === '1' }); break;
    case 'copyroom': if (window.mjAccount) { const code = window.mjAccount.room; Promise.resolve().then(() => navigator.clipboard.writeText(code)).then(() => toast('已複製房號 ' + code), () => toast('房號是 ' + code)); } break;
    case 'start': if (Host.on) startMatch(); break;
    case 'tile': {
      if (myPending(App.V)) return;
      const i = +d.i;
      if (App.sel === i) { const k = currentTiles()[i]; if (k != null) send({ t: 'discard', k }); }
      else { App.sel = i; render(); }
      break;
    }
    case 'discard': { const k = currentTiles()[App.sel]; if (k != null) send({ t: 'discard', k }); break; }
    case 'tsumo': send({ t: 'tsumo' }); break;
    case 'akong': send({ t: 'akong', k: +d.k }); break;
    case 'jkong': send({ t: 'jkong', k: +d.k }); break;
    case 'claim': {
      const o = V && V.priv && V.priv.opts;
      if (d.t === 'chi') { const q = o && o.claim && o.claim.chi && o.claim.chi[+d.q]; if (q) send({ t: 'chi', seq: q }); }
      else send({ t: d.t });
      break;
    }
    case 'auto': App.ov = null; send({ t: 'auto', on: d.on === '1' }); break;
    case 'ready': send({ t: 'ready' }); break;
    case 'menu': App.ov = 'menu'; render(); break;
    case 'sound': Snd.set(!Snd.on); render(); if (Snd.on) setTimeout(() => Snd.play('turn'), 120); break;
    case 'rules': App.ov = 'rules'; render(); break;
    case 'rtab': App.rulesTab = d.t; render(); { const rb = document.querySelector('.rules2 .rbody'); if (rb) rb.scrollTop = 0; } break;
    case 'close': App.ov = null; render(); break;
    case 'hideres': App.hideRes = V.game.handNo; render(); break;
    case 'showres': App.hideRes = -1; render(); break;
    case 'skipfx': if (App.flow) App.flow.skip = true; render(); break;
    case 'tingdecl': { const k = currentTiles()[App.sel]; if (k != null) send({ t: 'discard', k, ting: true }); break; }
    case 'stkopen': App.ov = 'stk'; render(); break;
    case 'invite': invite(); break;
    case 'profile': if (window.mjPanels) window.mjPanels.profile(); break;
    case 'ranking': if (window.mjPanels) window.mjPanels.ranking(); break;
    case 'leaveroom': App.ov = { ask: '離開這個房間、回到選房間畫面？如果牌局還在進行，你的位置會由電腦代打。', yes: 'leaveroom!' }; render(); break;
    case 'leaveroom!': if (window.mjAccount) window.mjAccount.leaveRoom(); break;
    case 'logout': App.ov = { ask: '登出帳號？如果牌局還在進行，你的位置會由電腦代打。', yes: 'logout!' }; render(); break;
    case 'logout!': if (window.mjAccount) window.mjAccount.logout(); break;
    case 'stk': {
      const id = +d.id; if (!(id >= 0 && id < STK_IMG.length) || Date.now() - (App.stkSent || 0) < 1200) break;
      App.stkSent = Date.now(); if (App.ov === 'stk') { App.ov = null; render(); }
      send({ t: 'stk', id }); break;
    }
    case 'takeover': App.ov = { ask: '接手主持後，由你的瀏覽器負責發牌與計分。這一局會重新發牌，分數與圈數保留。請在房主確定離線時才使用。', yes: 'takeover!' }; render(); break;
    case 'takeover!': takeover(false); break;
    case 'dissolve': App.ov = { ask: '解散牌桌後，所有人的座位與分數都會清除。', yes: 'dissolve!' }; render(); break;
    case 'dissolve!': dissolve(); break;
    case 'tolobby': App.ov = { ask: '結束目前牌局並回到大廳？本將分數會清除。', yes: 'tolobby!' }; render(); break;
    case 'tolobby!': toLobby(); break;
    case 'again': again(); break;
    case 'quitlocal': quitLocal(); break;
  }
}
document.addEventListener('click', onClick);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'nick-in') { saveNick(); return; }
  if (e.key === 'Enter' && e.target && /^cb-/.test(e.target.id || '')) { saveCustom(); return; }
  if (e.key === 'Escape' && App.ov && !(App.ov === 'nick' && needNick())) { App.ov = null; render(); }
});
setInterval(updateTimers, 250);
setInterval(() => {
  const V = App.V;
  if (App.net && !App.local && App.S && App.S.hostId === App.uid && !Host.on && !App.restoring) tryRestore(App.S);
  if (V && (V.screen === 'lobby' || App.feat.presence) && !V.isHost && App.online && V.hostId && !App.online.has(V.hostId)) renderSoon();
}, 3000);
setInterval(() => {
  if (!App.net || App.local || Host.on || !App.loaded) return;
  const g = App.S && App.S.game, now = Date.now();
  const gap = App.feat.push ? 15000 : g && (g.phase === 'play' || g.phase === 'end') ? 1800 : 3000;
  if (now - App.lastStateAt > gap && now - App.lastPollAt > gap) fetchState();
  if (App.pending && now - App.pending.at >= 8000) { App.pending = null; App.unconfirmedAt = now; fetchState(); renderSoon(); }
  const st = hostStale(App.V);
  if (st !== App.staleShown) { App.staleShown = st; renderSoon(); }
}, 1000);

/* ================= 啟動 ================= */
const use = n => (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
async function boot() {
  render();
  if (window.mjBackend) {
    let done = false; window.mjBackend.then(() => { done = true; });
    await Promise.race([window.mjBackend, sleep(15000)]);
    if (!done && window.mjGateOpen) await window.mjBackend; // 還在登入或選房間，繼續等
  }
  App.feat = (window.claude && window.claude.features) || {};
  const [db, user, room] = await Promise.all([use('db'), use('user'), use('room')]);
  App.db = db; App.user = user; App.room = room;
  App.uid = user ? await user.id() : null;
  App.booted = true;
  if (window.mjLocalOnly) { App.net = false; startLocal(); return; }
  if (!db || !App.uid) { App.net = false; if (window.mjBackend && !window.mjBackendError) window.mjBackendError = '連不上線上服務，請確認網路後重新整理。'; if (!App.local) App.V = { screen: 'start' }; render(); return; }
  if (needNick()) App.ov = 'nick';
  window.addEventListener('mj-names', () => { if (App.V) refreshNames(App.V); });
  window.addEventListener('mj-conn', () => renderSoon());
  App.net = true;
  try { App.canWrite = await user.can('data.write'); } catch (e) { App.canWrite = null; }
  await Keys.init();
  try {
    const d = await myRef().get();
    const x = d.exists ? d.data() : null;
    App.myActs = x && Array.isArray(x.acts) ? x.acts.filter(q => q && typeof q.n === 'number').slice(-6) : [];
    App.myN = App.myActs.reduce((m, q) => Math.max(m, q.n), 0);
    if (!x || JSON.stringify(x.pub) !== JSON.stringify(Keys.pub)) writePlayer();
  } catch (e) { writePlayer(); }
  const t = setTimeout(() => { if (!App.loaded) { App.err = '暫時連不上牌桌資料，請確認網路後重新整理。'; render(); } }, 10000);
  db.collection('mjp').onSnapshot(onPlayersSnap, () => {});
  stateRef().onSnapshot(s => { clearTimeout(t); if (App.err.startsWith('暫時')) App.err = ''; onStateSnap(s); },
    () => { clearTimeout(t); App.err = '牌桌資料連線中斷，請重新整理頁面。'; render(); });
  if (room) {
    room.presence({ uid: App.uid }).catch(() => {});
    room.onPeers(ch => {
      App.online = new Set(ch.peers.map(p => p.by || (p.presence && typeof p.presence.uid === 'string' ? p.presence.uid : null)).filter(Boolean));
      if (App.uid) App.online.add(App.uid);
      for (const u of App.online) App.seenEver.add(u);
      renderSoon();
    }, () => { App.online = null; renderSoon(); });
    room.on('ping', msg => {
      if (Host.on || App.local) return;
      const S = App.S, d = (msg && msg.data) || {};
      if (S && msg.by && S.hostId && msg.by !== S.hostId) return;
      if (S && d.tid && d.tid === S.tid && (d.v || 0) <= (S.v || 0)) return;
      App.lastPing = Date.now(); fetchState();
    }, () => {});
    room.on('act', msg => {
      if (!Host.on || App.local || !msg || !msg.by || !msg.data || !Array.isArray(msg.data.acts)) return;
      const pk = msg.data.pub;
      if (pk && typeof pk === 'object' && !pubOf(msg.by)) { App.roomPubs[msg.by] = pk; Host.publish(); }
      ingest(msg.by, msg.data.acts);
    }, () => {});
  }
  render();
}
window.mjTile = tile; // 個人資料頁畫牌用
window.__mj = { App, Host, renderSoon, fireFx, Snd, playScore }; // 測試用：讓自動化測試能調整單機節奏
boot();
}

</script>
